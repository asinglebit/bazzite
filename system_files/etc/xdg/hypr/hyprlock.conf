# Image-level fallback for hyprlock. NOT the lock screen this desktop normally
# shows -- see the search order and the reasoning in hypridle.conf beside this
# file. dotfiles/hypr/hyprlock.conf shadows this one once it is linked.
#
# WHY IT HAS TO EXIST. hyprlock has no built-in defaults either: with no config
# in any of the four search directories it exits 1, and since hypridle's
# lock_cmd is the only thing that runs it, the failure is a lock that never
# appears. Before this file, a login prior to `just link-dotfiles` had no lock
# screen at all.
#
# TWO DELIBERATE DIFFERENCES from the dotfiles version, both because this one's
# job is recoverability rather than looks:
#
#  1. No wallpaper. The dotfiles version points `path` at
#     $HOME/.config/sway/wallpaper.png, which is itself a dotfile -- depending
#     on it here would reintroduce exactly the dependency this file removes. A
#     flat fill needs nothing outside the image.
#
#  2. `hide_input` is left at its default, so keystrokes show as dots. The
#     dotfiles version turns it off on purpose (a dot count leaks the password
#     length), and notes the cost: with a Bluetooth keyboard that has not
#     reconnected there is no way to tell typing from not typing. On the
#     fallback -- reached on an unfamiliar or half-provisioned machine -- being
#     able to see that the keyboard works matters more.
#
# Fonts are image-level (10-sway-install.sh installs Inter and Hack Nerd Font
# Mono), so naming them here does not add a dependency. Palette matches the rest
# of the desktop: #1a1a1a / #242424 / #2e2e2e / #d8d8d8, alert #ffffff.

general {
    hide_cursor = true
}

background {
    monitor =

    # No image, so no `path` -- a flat fill in the desktop grey.
    color = rgb(242424)
}

input-field {
    monitor =

    size              = 320, 44
    outline_thickness = 1
    rounding          = 8

    inner_color = rgb(1a1a1a)
    outer_color = rgb(2e2e2e)
    font_color  = rgb(d8d8d8)

    # State by brightness, not hue, as everywhere else in this desktop.
    check_color = rgb(d8d8d8)
    fail_color  = rgb(ffffff)

    font_family = Hack Nerd Font Mono

    placeholder_text =
    fail_text        = $PAMFAIL

    position = 0, -40
    halign   = center
    valign   = center
}

label {
    monitor     =
    text        = $TIME
    font_family = Inter
    font_size   = 64
    color       = rgb(9a9a9a)

    position = 0, 80
    halign   = center
    valign   = center
}
