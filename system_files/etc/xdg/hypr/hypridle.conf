# Image-level fallback for hypridle. NOT the config this desktop normally runs.
#
# hypridle and hyprlock resolve their config through the same hyprutils helper,
# in this order:
#
#   $XDG_CONFIG_HOME/hypr/ -> $HOME/.config/hypr/ -> $XDG_CONFIG_DIRS/hypr/ -> /etc/xdg/hypr/
#
# so dotfiles/hypr/hypridle.conf shadows this file completely once
# `just link-dotfiles` has run. This is the LAST entry in that list, and it
# exists for the window before that: a fresh install, a new user account, or a
# machine where the repo is not checked out.
#
# WHY IT HAS TO EXIST. hypridle has no built-in defaults -- with no config in
# any of those four directories it exits 1. The unit ships Restart=on-failure,
# so systemd retries five times inside ten seconds, hits the default start
# limit, and then gives up for the rest of the session:
#
#     [CRITICAL] ConfigManager: No hypridle.conf file found in: ...
#     hypridle.service: Start request repeated too quickly.
#
# The symptom is silence. Nothing locks and nothing blanks, all session, with no
# error anywhere the user would think to look. This file is what keeps the rule
# the rest of the repo follows -- the dotfiles are a personal layer, not a
# dependency of the desktop.
#
# KEEP THE TIMINGS IN STEP with dotfiles/hypr/hypridle.conf. They are the same
# 300/360 on purpose, so linking the dotfiles changes how the lock screen LOOKS
# and nothing about when it fires. Drift here only shows up before the dotfiles
# are linked, which is exactly where nobody is looking.
#
# hyprlang errors on unknown keys and neither binary has a validate-only mode,
# so 16-hyprlock.sh can assert this file exists but never that it parses. Every
# key used here is one the dotfiles version already runs.

general {
    # One path for every lock: the sway binding, the timeout below, and
    # before_sleep_cmd all go through logind, so the pidof guard is effective.
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = swaymsg "output * power on"

    # A plain logind delay inhibitor. Not the default 2 ("auto"), which resolves
    # to the same thing on sway but silently; 3 would need a protocol sway does
    # not implement.
    inhibit_sleep    = 1
}

# Lock after five minutes idle.
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# Blank the outputs a minute after that. A separate listener, not a longer
# timeout, so DPMS can resume on input while the lock stays up.
listener {
    timeout    = 360
    on-timeout = swaymsg "output * power off"
    on-resume  = swaymsg "output * power on"
}
