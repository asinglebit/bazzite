# Deliberately empty, not a stub. The layered include merges the three
# config.d directories by BASENAME and a later copy REPLACES an earlier one, so
# this file retires /usr/share/sway/config.d/60-bindings-screenshot.conf entirely.
#
# Retired: the screenshot key bindings, driven by grimshot.
#
# NOT OPTIONAL, and the reason is ordering. layered-include emits its includes
# in BASENAME SORT ORDER, so 40-bindings.conf is read BEFORE this name and in
# sway a later `bindsym` wins -- rebinding these keys from 40-bindings.conf does
# NOT work. The drop-in has to go so 40-bindings.conf's version is the only one.
#
# Why /etc rather than dotfiles/, and how to undo this: see
# build_files/18-noctalia-shell.sh.
