# Deliberately empty, not a stub. The layered include merges the three
# config.d directories by BASENAME and a later copy REPLACES an earlier one, so
# this file retires /usr/share/sway/config.d/90-swayidle.conf entirely.
#
# Retired: `swayidle -w` driving swaylock, with four swaylock-specific hooks.
#
# noctalia's [idle] does this from the same process as the lock screen it
# triggers. swayidle and swaylock both stay installed -- sway-config-fedora
# hard-Requires them -- so removing this file is a genuine way back to a
# working, unthemed locker.
#
# Why /etc rather than dotfiles/, and how to undo this: see
# build_files/18-noctalia-shell.sh.
