# Deliberately empty, not a stub. The layered include merges the three
# config.d directories by BASENAME and a later copy REPLACES an earlier one, so
# this file retires /usr/share/sway/config.d/95-autostart-policykit-agent.conf entirely.
#
# Retired: `exec /usr/libexec/lxqt-policykit-agent`.
#
# NOTE THE MECHANISM: this is a bare sway `exec` in a package drop-in, so the
# OnlyShowIn= argument in 10-sway-install.sh does not apply -- it has fired on
# every login, and failed on every login, because lxqt-policykit links libQt6Xdg
# and dies at exec with a symbol lookup error. Survivable while mate-polkit
# answered everything; with noctalia as the agent it would be a second agent
# racing a working one.
#
# lxqt-policykit cannot be uninstalled. verify.sh checks it is installed and NOT
# running, which is the only way this file's absence would show.
#
# Why /etc rather than dotfiles/, and how to undo this: see
# build_files/18-noctalia-shell.sh.
