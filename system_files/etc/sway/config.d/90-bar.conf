# Deliberately empty. This is not a stub to be filled in.
#
# The layered include (/etc/sway/config:228) merges three directories by
# BASENAME -- /usr/share/sway/config.d, then /etc/sway/config.d, then
# $XDG_CONFIG_HOME/sway/config.d -- and a later copy REPLACES an earlier one.
# So a file of this name here retires /usr/share/sway/config.d/90-bar.conf
# entirely. Fedora's own config documents the trick at /etc/sway/config:222.
#
# WHY /etc AND NOT dotfiles/. A same-named file under ~/.config/sway/config.d/
# would work for a logged-in user and fail for a fresh install: dotfiles/ is
# linked by `just link-dotfiles`, which runs AFTER the first login, so until it
# has run the Fedora drop-in would still be live. build_files/16-hyprlock.sh
# made that mistake once already -- its /etc/xdg/hypr floor exists because a
# login before link-dotfiles got a session that never locked and never blanked,
# with no error on screen. Retiring in the image means there is no window in
# which this image ships two of something.
#
# It is also why this is recoverable: `sudo rm` this file and log out, and
# Fedora's drop-in loads again. bootc 3-way merges /etc, so the deletion sticks
# across upgrades. verify.sh reports the file missing, which is how you find out
# you did it and forgot.
#
# What it retired: `bar { swaybar_command waybar }`.
#
# waybar CANNOT be uninstalled -- sway-config-fedora hard-Requires it, see the
# long note in 10-sway-install.sh -- so this file is the only thing standing
# between this session and two bars drawn on top of each other. noctalia's bar
# is dotfiles/noctalia/30-bar.toml, started from noctalia.service.
#
# There is nothing to put in this file: sway's own `bar` block is not involved
# in a layer-shell bar at all.
