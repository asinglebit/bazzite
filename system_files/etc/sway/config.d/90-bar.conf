# Deliberately empty, not a stub. The layered include merges the three
# config.d directories by BASENAME and a later copy REPLACES an earlier one, so
# this file retires /usr/share/sway/config.d/90-bar.conf entirely.
#
# Retired: `bar { swaybar_command waybar }`.
#
# waybar CANNOT be uninstalled -- sway-config-fedora hard-Requires it -- so this
# file is the only thing between this session and two bars drawn on top of each
# other. There is nothing to put here instead: sway's own `bar` block is not
# involved in a layer-shell bar at all.
#
# Why /etc rather than dotfiles/, and how to undo this: see
# build_files/18-noctalia-shell.sh.
