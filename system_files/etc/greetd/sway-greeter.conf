# The greeter's compositor. Its only job is to host gtkgreet at a size that does
# not depend on the screen it lands on.
#
# WHY A COMPOSITOR AT ALL. tuigreet used to run directly on VT 1. A kernel
# console draws in cells of a fixed *pixel* bitmap -- eurlatgr, 8x16 -- and this
# kernel is built with `# CONFIG_FONTS is not set`, only 8x8 and 8x16 compiled
# in, so `fbcon=font:` has nothing bigger to offer and a userspace console font
# tops out at a 32px cell. Every one of those is a pixel size, so how big the
# greeter physically looks is a function of whichever mode the DRM fbdev helper
# picked and of the panel's PPI. Measured on this box, the same 8x16 cell came
# out 7.36mm tall on the 81 PPI HP and 3.69mm on the 160 PPI Dell -- which is
# the bug. Nothing on the console is resolution-independent.
#
# WHY GTKGREET RATHER THAN TUIGREET. Once a compositor is in the login path
# anyway, the greeter can be a real GTK client: gtkgreet is GTK3, so it picks up
# adw-gtk3-dark, Papirus-Dark and Inter from the image and is styled from
# /etc/gtkgreet/style.css in the same palette as the desktop. A GTK widget also
# scales from the output's logical size rather than from a bitmap cell, which is
# the DPI problem solved outright rather than worked around.
#
# sway is started by start-sway, NEVER by sway(1) directly. start-sway ends in
#     exec systemd-cat -- $_SWAY_COMMAND $_SWAY_EXTRA_ARGS "$@"
# so it passes -c straight through while sourcing /etc/sway/environment, and
# this instance inherits the `--unsupported-gpu -D noscanout` and
# WLR_RENDERER=gles2 that the session already proves work on this GPU. Invoking
# sway directly here would hit sway's own NVIDIA guard, and greetd would burn
# its five restarts against a VT that has no getty. See /etc/greetd/config.toml.
#
# Note that /usr/bin/sway is SwayFX by this point (it Provides: sway, installs
# at sway's path). Nothing here uses a SwayFX directive -- the greeter wants no
# blur and no rounding -- so this file parses identically under either.
#
# `sway -c` reads this file and nothing else. That is deliberate:
# /etc/sway/config.d holds sway-systemd session plumbing (cgroups,
# graphical-session.target) that a greeter has no use for.

# Password entry has to match the console keymap (vconsole KEYMAP=us).
# libxkbcommon already defaults to us; stated so that changing the layout is one
# edit here rather than a discovery at the password prompt.
input type:keyboard xkb_layout "us"

# gtkgreet is the only client that will ever exist here. #1a1a1a is the darkest
# surface in the desktop palette and the same colour gtkgreet's own stylesheet
# paints, so there is no flash between the compositor coming up and the greeter
# drawing, nor on the handoff into the session.
default_border none
output * bg #1a1a1a solid_color

# The greeter has no use for X11 clients, and not starting Xwayland keeps the
# NVIDIA surface area in the login path as small as it can be.
xwayland disable

# --layer-shell puts the greeter on a layer surface rather than in a toplevel
# window, so it fills the output without a floating window to focus.
#
# `swaymsg exit` runs if gtkgreet ever exits without authenticating, so greetd
# sees the session end and restarts it instead of leaving a live compositor
# showing an empty screen. (Upstream's packaged gtkgreet-sway.conf uses
# `wayland-logout` for this; swaymsg is already here and needs no extra
# package.)
exec "gtkgreet --layer-shell --style /etc/gtkgreet/style.css; swaymsg exit"
