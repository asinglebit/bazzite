# greetd + noctalia-greeter, which brings its own wlroots 0.20 compositor.
# greetd rather than sddm-wayland-sway, which gives no way to pass sway its NVIDIA flags.
#
# tuigreet is the fallback, because it needs no compositor and no GPU. To fall back:
#
#   command = "tuigreet --time --remember --remember-user-session --asterisks --kb-sessions 3 --sessions /usr/share/wayland-sessions --cmd start-sway"
#
# then `systemctl restart greetd`.

[terminal]
vt = 1

[default_session]
# The wrapper, not the greeter directly, because the compositor inherits nothing from sway.
# The build greps this line, so a typo fails the build rather than burning greetd's five restarts.
command = "/usr/libexec/noctalia-greeter-nvidia"
user = "greetd"
