# /var content shipped in a bootc image is only applied on INITIAL provisioning.
# Switching an already-installed system is an upgrade, so anything the newly
# installed RPMs (and their scriptlets) dropped into /var would silently not
# exist here. Recreate it on every boot instead.
#
# Entries below are exactly what `bootc container lint` reported as missing.

# greetd's home. The greetd package ships this as a packaged directory and only
# has a `Z` rule for it, which adjusts ownership but does not create anything.
d  /var/lib/greetd                                              0755 greetd greetd -
d  /var/lib/greetd/.config                                      0755 greetd greetd -
d  /var/lib/greetd/.config/systemd                              0755 greetd greetd -
d  /var/lib/greetd/.config/systemd/user                         0755 greetd greetd -
# Masks the portal for the greeter's own user session (created by a scriptlet,
# owned by no package).
L  /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null

# noctalia-greeter's state directory, and the image's copy of its config.
#
# The greeter reads /var/lib/noctalia-greeter/greeter.toml and has no /etc path
# in its search order at all, which is why this is a tmpfiles job rather than a
# file shipped in the image. 0750 and greetd ownership are not cosmetic: the
# documented symptom of a state directory the greeter cannot use is a BLANK
# login screen. Owned by greetd rather than upstream's `greeter` because that is
# the user /etc/greetd/config.toml runs the session as; the greeter resolves
# either name, but the directory has to match the one it actually gets.
#
# Its SELinux label comes from the file_contexts alias 17-noctalia-greeter.sh
# installs -- without it this lands as var_lib_t, which xdm_t cannot write.
d  /var/lib/noctalia-greeter                                    0750 greetd greetd -
# `r` THEN `C`, and specifically NOT `C+`.
#
# The + on a C line does not mean "replace", which is the reading this file used
# to be written against. tmpfiles.d(5): C copies "if the destination files or
# directories do not exist yet or the destination directory is empty", and the +
# only lifts the refusal to DESCEND INTO a destination directory that already
# exists and is non-empty. For a destination FILE that already exists, C and C+
# behave identically -- both skip, and both log nothing. Measured on systemd
# 259: C+ over an existing greeter.toml leaves it byte for byte untouched.
#
# So the previous rule worked exactly once, on initial provisioning, and every
# later edit to the image's greeter.toml was shadowed forever by whatever was
# already in /var -- the precise failure the C+ was chosen to avoid.
#
# systemd-tmpfiles-setup.service runs `--create --remove --boot`, and the remove
# pass precedes the create pass within one invocation, so these two lines
# together are an unconditional refresh from the image on every boot.
#
# Only greeter.toml, which is why this is not `R` on the directory: sync.toml
# beside it is the greeter's own mutable state -- last user, last session -- and
# is deliberately left alone.
#
# Source is omitted, which means
# /usr/share/factory/var/lib/noctalia-greeter/greeter.toml.
#
# NOTE, so the next reader does not mistake it for this rule failing: the
# greeter REWRITES greeter.toml when it starts. What ends up on disk is its own
# canonical serialisation -- comments stripped, keys sorted, palette indented
# under [appearance.palette], and `scheme` dropped because that one is read from
# sync.toml. The values survive; the file does not stay identical to the source.
r  /var/lib/noctalia-greeter/greeter.toml
C  /var/lib/noctalia-greeter/greeter.toml                       0640 greetd greetd - -

# tuigreet's --remember* cache. tuigreet is the fallback greeter, unbound; see
# /etc/greetd/config.toml.
d  /var/cache/tuigreet                                          0755 greetd greetd -

# blueman state.
d  /var/lib/blueman                                             0755 root   root   -
