# /var content shipped in a bootc image is only applied on INITIAL provisioning,
# and switching an already-installed system is an upgrade -- so anything the new
# RPMs dropped into /var would silently not exist. Recreate it on every boot.

# greetd's home. The greetd package ships this as a packaged directory with only
# a `Z` rule, which adjusts ownership but creates nothing.
d  /var/lib/greetd                                              0755 greetd greetd -
d  /var/lib/greetd/.config                                      0755 greetd greetd -
d  /var/lib/greetd/.config/systemd                              0755 greetd greetd -
d  /var/lib/greetd/.config/systemd/user                         0755 greetd greetd -
# Masks the portal for the greeter's own user session.
L  /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null

# The greeter reads /var/lib/noctalia-greeter/greeter.toml and has no /etc path
# in its search order, which is why this is a tmpfiles job. 0750 and greetd
# ownership are not cosmetic -- the symptom of a state directory the greeter
# cannot use is a BLANK login screen. greetd rather than upstream's `greeter`
# because that is the user /etc/greetd/config.toml runs as.
#
# Its SELinux label comes from the file_contexts alias 17-noctalia-greeter.sh
# installs; without it this lands as var_lib_t, which xdm_t cannot write.
d  /var/lib/noctalia-greeter                                    0750 greetd greetd -
# `r` THEN `C`, and specifically NOT `C+`. The + does not mean "replace": per
# tmpfiles.d(5) it only lifts the refusal to DESCEND INTO an existing non-empty
# destination DIRECTORY. Over an existing destination FILE, C and C+ behave
# identically -- both skip, both log nothing (measured on systemd 259). A C+ here
# worked exactly once, on initial provisioning, and shadowed every later edit to
# the image's greeter.toml forever.
#
# systemd-tmpfiles-setup.service runs `--create --remove --boot`, and the remove
# pass precedes the create pass in one invocation, so these two lines together
# are an unconditional refresh from the image on every boot.
#
# Only greeter.toml, not `R` on the directory: sync.toml beside it is the
# greeter's own mutable state (last user, last session) and is left alone.
#
# Source omitted means /usr/share/factory/var/lib/noctalia-greeter/greeter.toml.
#
# NOTE, so this is not mistaken for the rule failing: the greeter REWRITES
# greeter.toml when it starts, into its own canonical serialisation -- comments
# stripped, keys sorted. The values survive; the file does not stay identical.
r  /var/lib/noctalia-greeter/greeter.toml
C  /var/lib/noctalia-greeter/greeter.toml                       0640 greetd greetd - -

# tuigreet's --remember* cache; tuigreet is the unbound fallback greeter.
d  /var/cache/tuigreet                                          0755 greetd greetd -

d  /var/lib/blueman                                             0755 root   root   -
