# /var in a bootc image is only applied on first install, so recreate it on every boot.

# greetd's home, which the package's own Z rule adjusts but never creates.
d  /var/lib/greetd                                              0755 greetd greetd -
d  /var/lib/greetd/.config                                      0755 greetd greetd -
d  /var/lib/greetd/.config/systemd                              0755 greetd greetd -
d  /var/lib/greetd/.config/systemd/user                         0755 greetd greetd -
# Masks the portal for the greeter's own user session.
L  /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null

# The greeter has no /etc path in its search order, so its config lands here instead.
# A state directory the greeter cannot use is a blank login screen.
d  /var/lib/noctalia-greeter                                    0750 greetd greetd -
# r then C, never C+, which over an existing file behaves the same and skips it.
# The remove pass runs before the create pass, so together these refresh from the image each boot.
# The greeter rewrites this file on start, so the values survive but the file does not stay identical.
r  /var/lib/noctalia-greeter/greeter.toml
C  /var/lib/noctalia-greeter/greeter.toml                       0640 greetd greetd - -

# tuigreet's cache, the unbound fallback greeter.
d  /var/cache/tuigreet                                          0755 greetd greetd -

d  /var/lib/blueman                                             0755 root   root   -
