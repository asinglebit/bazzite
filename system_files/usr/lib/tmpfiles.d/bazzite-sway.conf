# /var content shipped in a bootc image is only applied on INITIAL provisioning.
# Switching an already-installed system is an upgrade, so anything the newly
# installed RPMs (and their scriptlets) dropped into /var would silently not
# exist here. Recreate it on every boot instead.
#
# Entries below are exactly what `bootc container lint` reported as missing.

# greetd's home. The greetd package ships this as a packaged directory and only
# has a `Z` rule for it, which adjusts ownership but does not create anything.
d  /var/lib/greetd                                              0755 greetd greetd -
d  /var/lib/greetd/.config                                      0755 greetd greetd -
d  /var/lib/greetd/.config/systemd                              0755 greetd greetd -
d  /var/lib/greetd/.config/systemd/user                         0755 greetd greetd -
# Masks the portal for the greeter's own user session (created by a scriptlet,
# owned by no package).
L  /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null

# tuigreet's --remember* cache.
d  /var/cache/tuigreet                                          0755 greetd greetd -

# blueman state.
d  /var/lib/blueman                                             0755 root   root   -
