<!-- The greeter's user avatar: rattleworks' mark, inverted to white.

     SOURCE. Traced with potrace; the original is a black silhouette on a
     transparent ground, so "inverted" here is one attribute (fill #000000
     becomes #ffffff) and nothing is rasterised. It stays SVG deliberately: the
     greeter links librsvg and scales through wp_fractional_scale_v1, which is
     the property this whole greeter was chosen for. A PNG would be the
     console-cell mistake again, baked at one size.

     WHITE, not #d8d8d8. Measured from a rendered greeter: the avatar draws at
     the top of the login card with no frame around it, and that card is
     `surface_variant` (#242424), not `surface`. It is a silhouette rather than
     text, so it takes the brightest end of the greyscale ramp the way `error`
     does. Every value here is r=g=b; there is no hue to drift.

     HOW IT REACHES THE GREETER. noctalia-greeter has no avatar key in
     greeter.toml: it asks AccountsService for the user's IconFile. Out of the
     box that resolves to $HOME/.face, which cannot work here. The greeter runs
     as greetd, $HOME is 0700, so it cannot even traverse it, and the file did
     not exist anyway. That is why the stock person placeholder was showing.
     `just greeter-avatar` points AccountsService at THIS path instead, which
     is in /usr and world readable. -->
<svg version="1.0" xmlns="http://www.w3.org/2000/svg"
 width="250.000000pt" height="250.000000pt" viewBox="0 0 250.000000 250.000000"
 preserveAspectRatio="xMidYMid meet">
<metadata>
