# The login screen, painted from the desktop's palette.
# Under /usr/share/factory, because /var in a bootc image is only applied on first install.
# The greeter rewrites the /var copy on start, so a shorter file there is not a failed copy.

[appearance]
# `palette` beats Sync, so this pins the look to the values below.
# The sixteen roles also exist in the shell's palette JSON, and verify.sh checks they agree.
scheme     = "Synced"
theme_mode = "dark"

font_family = "Inter"

# Stays 1.0 while the shell's is 0.7, because nothing rounds this greeter's surfaces.
corner_radius_scale = 1.0

hide_logo                = true
# Visible, this offers a colour scheme swap, which a greyscale desktop cannot survive.
scheme_selector_position = "hidden"
power_buttons_position   = "bottom-right"

# "random" varies the glyph count, so the field leaks neither the characters nor the length.
password_style = "random"

# Seeds, not literals: the greeter tone-adjusts them a few units, staying neutral.
# The caret and submit button keep Noctalia's accent and cannot be reached from here.
[appearance.palette]
surface            = "#1a1a1a"
on_surface         = "#d8d8d8"
surface_variant    = "#242424"
on_surface_variant = "#9a9a9a"
outline            = "#2e2e2e"

# Flat, so the shadow collapses into the surface it would fall on.
shadow             = "#1a1a1a"

# primary is the one filled block on screen -- the focused control, inverted.
primary            = "#d8d8d8"
on_primary         = "#1a1a1a"
secondary          = "#9a9a9a"
on_secondary       = "#1a1a1a"
tertiary           = "#5a5a5a"
on_tertiary        = "#d8d8d8"

# Greyscale has no red, so a failed login signals with brightness.
error              = "#ffffff"
on_error           = "#1a1a1a"

hover              = "#2e2e2e"
on_hover           = "#d8d8d8"

# No `path`, because the wallpaper is a dotfile and the login screen must not need link-dotfiles.
[appearance.wallpaper]
fill_color = "#1a1a1a"

# Must match the console keymap, so us-only even though the session has us,ru.
[keyboard]
layout  = "us"
numlock = true

[auth]
allow_empty_password = false

# No [output] block: per-monitor scale constants are wrong the first time a monitor moves.
# Left alone, the greeter derives each output's scale from its own geometry.
