# GTK4. Same values as gtk-3.0/settings.ini minus the GTK3-only keys.
#
# IMPORTANT: libadwaita apps ignore gtk-application-prefer-dark-theme entirely.
# They ask the XDG desktop portal for org.freedesktop.appearance color-scheme,
# which xdg-desktop-portal-gtk answers from GSettings. That is the same signal
# Firefox, Chromium and Electron follow. It lives in dconf, not in this repo,
# so if dark ever reverts for those apps it is this that got lost:
#
#   gsettings set org.gnome.desktop.interface color-scheme prefer-dark
#
# Check what the portal is actually reporting (0 none, 1 dark, 2 light):
#
#   busctl --user call org.freedesktop.portal.Desktop /org/freedesktop/portal/desktop \
#       org.freedesktop.portal.Settings ReadOne ss \
#       org.freedesktop.appearance color-scheme
#
# sway-portals.conf routes impl.portal.Settings to the gtk backend, and
# 30-kde-remove.sh asserts xdg-desktop-portal-gtk survives, so this channel
# holds on :sway.

[Settings]
gtk-application-prefer-dark-theme=true
gtk-theme-name=Adwaita

gtk-icon-theme-name=breeze-dark
gtk-cursor-theme-name=breeze_cursors
gtk-cursor-theme-size=24

gtk-font-name=Noto Sans 10

# See the long note in gtk-3.0/settings.ini. 98304 = 96 DPI.
gtk-xft-dpi=98304
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

gtk-enable-animations=true
gtk-cursor-blink=true
gtk-primary-button-warps-slider=true
gtk-decoration-layout=icon:minimize,maximize,close
