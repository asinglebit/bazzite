# Same values as gtk-3.0/settings.ini minus the GTK3-only keys.
#
# libadwaita apps ignore gtk-application-prefer-dark-theme entirely -- they ask
# the XDG portal for org.freedesktop.appearance color-scheme, which
# xdg-desktop-portal-gtk answers from GSettings. That lives in dconf, not in
# this repo, so if dark ever reverts for those apps this is what got lost:
#
#   gsettings set org.gnome.desktop.interface color-scheme prefer-dark
#
# Check what the portal actually reports (0 none, 1 dark, 2 light):
#
#   busctl --user call org.freedesktop.portal.Desktop /org/freedesktop/portal/desktop \
#       org.freedesktop.portal.Settings ReadOne ss \
#       org.freedesktop.appearance color-scheme

[Settings]
gtk-application-prefer-dark-theme=true
gtk-theme-name=adw-gtk3-dark

# See gtk-3.0/settings.ini for the folder-colour note.
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

gtk-font-name=Inter 10

# 98304 = 96 DPI. See gtk-3.0/settings.ini.
gtk-xft-dpi=98304
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

gtk-enable-animations=true
gtk-cursor-blink=true
gtk-primary-button-warps-slider=true
gtk-decoration-layout=icon:minimize,maximize,close
