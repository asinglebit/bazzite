<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Generic "monospace" resolves to Hack Nerd Font Mono, so anything asking
       for the alias lands on the same face as the bar and the terminal. User
       config is parsed after /etc, so this prefer wins over the nerd-fonts
       package's Symbols Nerd Font.

       Deliberately does not touch sans-serif or serif: gtk-font-name in
       gtk-{3,4}.0/settings.ini is a proportional UI font and stays one.

       Check with: fc-match monospace -->
  <alias>
    <family>monospace</family>
    <prefer><family>Hack Nerd Font Mono</family></prefer>
  </alias>

</fontconfig>
