<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- Generic "monospace" resolves to Hack Nerd Font Mono, so GTK apps, editors
       and anything else that asks for the alias rather than naming a family
       lands on the same face as the bar and the terminal.

       This is the only fontconfig file either repo owns. It deliberately does
       NOT touch sans-serif or serif: gtk-font-name in gtk-{3,4}.0/settings.ini
       is a proportional UI font and should stay one.

       /etc/fonts/conf.d/10-nerd-font-symbols.conf, shipped by the nerd-fonts
       package in the base image, already prepends Symbols Nerd Font to
       monospace. That stays harmless: Hack Nerd Font Mono carries the icons
       itself, so the fallback is never reached for them. User config is parsed
       after /etc, so this prefer wins.

       Check with:  fc-match monospace  ->  HackNerdFontMono-Regular.ttf -->
  <alias>
    <family>monospace</family>
    <prefer><family>Hack Nerd Font Mono</family></prefer>
  </alias>

</fontconfig>
