# Replaces the file kde-gtk-config generated while Plasma was in charge.
#
# Two things in that generated file were actively wrong for this session:
#   gtk-modules=colorreload-gtk-module  -- ships in kde-gtk-config, which
#       30-kde-remove.sh removes at boot 2; GTK then warns on every launch.
#   gtk-xft-dpi=162201                  -- see the note on that key below.

[Settings]

# GTK3 reads the dark variant from this flag. GTK4/libadwaita ignore it and
# follow the portal instead, so both channels are covered (see gtk-4.0).
gtk-application-prefer-dark-theme=true
gtk-theme-name=adw-gtk3-dark

# Icon theme, cursor theme and UI font.
#
# All three changed together when Papirus and Inter entered the image, and the
# reason is the same in each case: what was here before was a leftover rather
# than a decision.
#
# gtk-theme-name: adw-gtk3-dark is libadwaita's own stylesheet backported to
# GTK3, so GTK3 apps (Thunar, nm-applet, blueman-manager, swappy, wlogout)
# stop looking a decade older than the GTK4 ones beside them. That
# matters more than it sounds on this desktop: swaync is GTK4 + libadwaita
# while wlogout and swappy are GTK3, so without this the new UI is split across
# two eras.
#
#   That list is `ldd` output, not a guess, and it no longer includes
#   pavucontrol: F44 ships it linking libgtk-4.so.1. It is a plain GTK4 app,
#   so it still follows gtk-theme-name from THIS key -- it just resolves it to
#   adw-gtk3-dark's gtk-4.0/ directory rather than its gtk-3.0/ one.
#
# The `-dark` variant is named explicitly rather than relying on
# gtk-application-prefer-dark-theme below, because a named theme is
# deterministic and the flag is a hint.
#
# gtk-icon-theme-name: breeze-dark was a KDE icon set that survived only
# because 30-kde-remove.sh's guard rails deliberately kept breeze-icon-theme
# alive for it -- a load-bearing dependency on Plasma's assets, on a machine
# whose entire point is that Plasma is gone. Those guard rails are now gone too.
#
#   NOTE: the FOLDER COLOUR is not set here and cannot be. Papirus ships folder
#   variants as separate files and papirus-folders symlinks the chosen colour
#   into place, which build_files/10-sway-install.sh does at image build time
#   because /usr/share/icons is read-only at runtime. Switching this value away
#   from Papirus and back does not lose the black folders; switching to a
#   different Papirus flavour (Papirus-Light, ePapirus) would, because those are
#   separate theme trees the build does not touch.
#
# gtk-cursor-theme-name: Adwaita, which needed no new package at all --
# adwaita-cursor-theme was already installed as a GTK dependency. That is what
# made retiring the breeze-cursor-theme guard rail free.
#
# gtk-font-name: Inter. The monospace half of this desktop was already
# deliberate (Hack Nerd Font Mono in the bar, terminal, launcher and lock
# screen, via fontconfig/fonts.conf); the proportional half was still Fedora's
# default. This is the only typographic choice in the two repos that had not
# been made.
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

gtk-font-name=Inter 10

# 96 DPI (98304 = 96 * 1024).
#
# The generated file had 162201, i.e. 158.4 DPI -- Plasma's own scaling for the
# 4K panel, baked into a font setting. Sway now does the scaling at the
# compositor (output scale 2), so a non-96 value here multiplies on top of it
# and renders GTK text about 1.65x oversized. If text ends up too small for
# your taste, raise gtk-font-name to 11; do not put the scaling back here.
gtk-xft-dpi=98304
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

gtk-enable-animations=true
gtk-cursor-blink=true
gtk-primary-button-warps-slider=true
gtk-decoration-layout=icon:minimize,maximize,close
