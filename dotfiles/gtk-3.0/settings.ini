[Settings]

# GTK3 reads the dark variant from this flag; GTK4/libadwaita ignore it and
# follow the portal instead, so both channels are covered. The `-dark` theme is
# named explicitly because a named theme is deterministic and the flag is a hint.
gtk-application-prefer-dark-theme=true
gtk-theme-name=adw-gtk3-dark

# The FOLDER COLOUR is not set here and cannot be: Papirus ships folder variants
# as separate files and papirus-folders symlinks the chosen one into place,
# which build_files/10-sway-install.sh does at build time because
# /usr/share/icons is read-only at runtime. Switching to a different Papirus
# flavour (Papirus-Light, ePapirus) would lose the black folders.
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

gtk-font-name=Inter 10

# 96 DPI (98304 = 96 * 1024). The kde-gtk-config file this replaced had 162201,
# i.e. Plasma's own scaling for the 4K panel baked into a font setting. Sway
# scales at the compositor now, so a non-96 value multiplies on top of it and
# renders GTK text about 1.65x oversized. If text is too small, raise
# gtk-font-name; do not put the scaling back here.
gtk-xft-dpi=98304
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

gtk-enable-animations=true
gtk-cursor-blink=true
gtk-primary-button-warps-slider=true
gtk-decoration-layout=icon:minimize,maximize,close
