[Settings]

# GTK3 reads dark from this flag; GTK4 ignores it and asks the portal, so both are covered.
gtk-application-prefer-dark-theme=true
gtk-theme-name=adw-gtk3-dark

# The folder colour cannot be set here, because papirus-folders symlinks it in at build time.
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

gtk-font-name=Inter 10

# 96 DPI (96 * 1024), because sway scales at the compositor and any other value multiplies on top.
gtk-xft-dpi=98304
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

gtk-enable-animations=true
gtk-cursor-blink=true
gtk-primary-button-warps-slider=true
gtk-decoration-layout=icon:minimize,maximize,close
