# The bar reports state and the control centre changes it, which is why nearly every
# glyph on the right just opens the control centre.

[bar]
order = [ "default" ]

    [bar.default]
    position = "top"
    layer    = "top"

    # Full width against the top edge, so square corners; 25-effects.conf matches this.
    radius               = 0
    radius_top_left      = 0
    radius_top_right     = 0
    radius_bottom_left   = 0
    radius_bottom_right  = 0
    margin_edge          = 0
    margin_ends          = 0
    margin_opposite_edge = 0
    concave_edge_corners = false
    reserve_space        = true

    # thickness is the first number to check by eye.
    thickness      = 24
    padding        = 8
    widget_spacing = 4
    font_scale     = 1.01
    font_weight    = 500

    # Picked for its Latin shapes, which are narrower than the shell font and fit this thin bar.
    font_family    = "Noto Sans Sinhala"

    # Needed for the blur to show: an opaque bar still pays for the blur behind it, but hides it.
    background_opacity = 0.6

    # A choice, not a duplicate: the compositor's shadows never reach a bar anyway.
    shadow          = false
    contact_shadow  = false
    border          = "outline"
    border_width    = 0.0
    hover_highlight = true

    # No per-monitor table on purpose, because noctalia keys those by connector name and
    # connectors move; if the bar looks wrong, change this one number instead.
    scale = 0.75

    start  = [ "workspaces" ]
    center = [ "active_window" ]
    end    = [
        "privacy",
        "audio_visualizer",
        "tray",
        "screenshot",
        "color_picker",
        "keyboard_layout",
        "output_volume",
        "network",
        "bluetooth",
        "notifications",
        "clock",
    ]

    # The widgets that do something sit outside the capsule, and anything inserted into it splits the pill.
    capsule_group     = [ "output_volume", "network", "bluetooth", "notifications" ]
    capsule           = true
    capsule_fill      = "surface_variant"
    capsule_opacity   = 0.35
    capsule_padding   = 6.0
    capsule_radius    = 9.0
    capsule_thickness = 0.76

# A widget's name is its id and `type` is what it is.
# Middle-click opens a settings page unless it is bound to something else or to "none".
# Plugin widgets cannot take an actions table at all; the validator rejects the key.

[widget.workspaces]
type                = "workspaces"
# Each bar shows only its own screen's ten; show_all_outputs is the one that filters.
show_all_outputs    = false
focused_output_only = true
# Dots, not digits: the number is already on the key you pressed.
# Colours name a palette role, not a hex, so bazzite-grey.json stays the only place one is set.
show_labels         = false
pill_scale          = 0.6
active_pill_size    = 2.0
capsule_padding     = 15
occupied_color      = "tertiary"
urgent_color        = "secondary"

    [widget.workspaces.actions]
    middle = "none"

[widget.active_window]
type       = "active_window"
max_length = 260.0
min_length = 0.0

    [widget.active_window.actions]
    middle = "none"

# Screen sharing here always captures the whole screen, and this is the only thing that says so.
# It stays hidden until then, so its appearing is the signal.
[widget.privacy]
type          = "privacy"
hide_inactive = true

    [widget.privacy.actions]
    middle = "none"

# Outside the pill because the icons belong to whatever apps registered them.
[widget.tray]
type = "tray"

# The rules live in 10-shell.toml, so this button and the Print key behave the same.
[widget.screenshot]
type = "screenshot"

    [widget.screenshot.actions]
    middle = "none"

# A plugin, fetched through the community source in 50-services.toml.
# Expect one validator warning here and ignore it: validation never fetches, so it cannot see the type.
[widget.color_picker]
type = "oldirtty/color_picker:widget"

# Alt+Shift cycles us/ru, and this glyph is the only thing that says which one is live.
# `short` draws "US", because "English (US)" does not fit a 24px bar.
[widget.keyboard_layout]
type    = "keyboard_layout"
display = "short"

# Defined but not placed: none of the four below is in `start` or `end`, and adding one back is one line.

[widget.swaymode]
type = "asinglebit/bazzite-sway:swaymode"

[widget.scratchpad]
type = "asinglebit/bazzite-sway:scratchpad"

[widget.failedunits]
type = "asinglebit/bazzite-sway:failedunits"

[widget.hardware]
type = "asinglebit/bazzite-sway:hardware"

[widget.output_volume]
type       = "volume"
device     = "output"
# One glyph, no percentage: the number is in the OSD and the control centre already.
show_label = false

    # Scrolling on the glyph already changes volume; right-click keeps pavucontrol for routing.
    [widget.output_volume.actions]
    left   = "panel-toggle control-center"
    right  = "run pavucontrol"
    middle = "volume-mute"

[widget.network]
type       = "network"
show_label = false

    [widget.network.actions]
    left   = "panel-toggle control-center"
    middle = "none"

[widget.bluetooth]
type = "bluetooth"

    # noctalia handles normal pairing, and blueman-manager stays for the awkward cases.
    [widget.bluetooth.actions]
    left   = "panel-toggle control-center"
    right  = "run blueman-manager"
    middle = "none"

[widget.notifications]
type = "notifications"

    [widget.notifications.actions]
    left   = "panel-toggle control-center"
    right  = "notification-dnd-toggle"
    middle = "notification-clear-active"

[widget.clock]
type   = "clock"
format = "{:%H:%M}"

    [widget.clock.actions]
    left   = "panel-toggle control-center"
    middle = "none"

# Shows that sound is actually playing, which the volume glyph cannot: muted and silent look the same there.
[widget.audio_visualizer]
type = "audio_visualizer"

    [widget.audio_visualizer.actions]
    middle = "none"
