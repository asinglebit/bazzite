# The bar REPORTS state; the control centre CHANGES it. That division is why
# every widget on the right is a single glyph with no text beside it, and why
# nearly all of them share one left-click target.

[bar]
order = [ "default" ]

    [bar.default]
    position = "top"
    layer    = "top"

    # Full width, hard against the top edge, square. 25-effects.conf gives this
    # bar's namespace corner_radius 0 for the same reason.
    radius               = 0
    radius_top_left      = 0
    radius_top_right     = 0
    radius_bottom_left   = 0
    radius_bottom_right  = 0
    margin_edge          = 0
    margin_ends          = 0
    margin_opposite_edge = 0
    concave_edge_corners = false
    reserve_space        = true

    # thickness is the first number to check by eye.
    thickness      = 24
    padding        = 8
    widget_spacing = 4
    font_scale     = 1.01
    font_weight    = 500

    # A LATIN face here -- the Sinhala coverage the family is named for is not
    # the part that renders. It sets narrower and more even than the shell's
    # Noto Sans CJK SC, which is what lets font_scale sit above 1.0 in a bar
    # scaled to 0.75. It has no Cyrillic; layout names are Latin, so that only
    # matters if custom_labels are ever set to Cyrillic strings.
    font_family    = "Noto Sans Sinhala"

    # Not decoration: SwayFX blurs what is BEHIND a translucent surface, so an
    # opaque bar does not disable the blur, it hides it and still pays for it.
    background_opacity = 0.6

    # A choice, not a duplicate avoided: SwayFX's `shadows enable` applies to
    # views, and a layer surface gets only what its layer_effects line asks for.
    shadow          = false
    contact_shadow  = false
    border          = "outline"
    border_width    = 0.0
    hover_highlight = true

    # NO [bar.default.monitor.*] TABLE, DELIBERATELY. noctalia keys per-monitor
    # overrides by CONNECTOR name, and this desktop matches outputs by EDID
    # precisely because connectors move. If the bar is wrong it is wrong on both
    # monitors, and the fix is this `scale` or ui_scale in 10-shell.toml -- one
    # number, not a table of connectors.
    #
    # 0.75 multiplies with ui_scale 0.9, landing the chrome near two thirds of
    # noctalia's own sizing, which is what fits the 24px strip.
    scale = 0.75

    start  = [ "workspaces" ]
    center = [ "active_window" ]
    end    = [
        "privacy",
        "audio_visualizer",
        "tray",
        "screenshot",
        "color_picker",
        "keyboard_layout",
        "output_volume",
        "network",
        "bluetooth",
        "notifications",
        "clock",
    ]

    # screenshot, color_picker and keyboard_layout are the widgets that DO
    # something rather than report something, so they sit outside the capsule
    # next to the tray. The capsule is drawn as one run, so anything inserted
    # between two of its names splits the pill in half.
    capsule_group     = [ "output_volume", "network", "bluetooth", "notifications" ]
    capsule           = true
    capsule_fill      = "surface_variant"
    capsule_opacity   = 0.35
    capsule_padding   = 6.0
    capsule_radius    = 9.0
    capsule_thickness = 0.76

# A widget's NAME is its id and is what the bar lists; `type` is what it is.
#
# Every widget defaults to middle = "settings-open-widget", so a middle-click
# opens a settings page unless bound to something or to "none".
#
# PLUGIN WIDGETS CANNOT TAKE [widget.<name>.actions] -- it is not a binding that
# fails at runtime, it is a key noctalia does not know, and `config validate`
# reports it as an unknown setting.

[widget.workspaces]
type                = "workspaces"
# Each screen owns a private block of ten workspaces, so a bar listing every
# workspace would draw both screens' blocks on both screens -- twenty dots, of
# which ten are unreachable from that keyboard position. show_all_outputs is the
# one that filters; focused_output_only only decides how the OTHER screen's
# active workspace is tinted, and its name is more promising than its job.
show_all_outputs    = false
focused_output_only = true
# Dots, not digits: the number is already on the key you pressed, and with the
# blocks it is the only honest label -- this screen's third dot is workspace 13.
# The colours name a PALETTE ROLE rather than a hex, so bazzite-grey.json stays
# the one place a colour is decided.
show_labels         = false
pill_scale          = 0.6
active_pill_size    = 2.0
capsule_padding     = 15
occupied_color      = "tertiary"
urgent_color        = "secondary"

    [widget.workspaces.actions]
    middle = "none"

[widget.active_window]
type       = "active_window"
max_length = 260.0
min_length = 0.0

    [widget.active_window.actions]
    middle = "none"

# Screen sharing through xdg-desktop-portal-wlr is whole-output only, with no
# window picker: when something is capturing, it is capturing everything, and
# this is the only thing on screen that says so. hide_inactive is what makes its
# appearing the signal, rather than one more glyph to learn to ignore.
[widget.privacy]
type          = "privacy"
hide_inactive = true

    [widget.privacy.actions]
    middle = "none"

# Outside the pill because its contents are not ours -- whatever applications
# registered, in their own artwork.
[widget.tray]
type = "tray"

# What it captures and where it lands are [shell.screenshot] in 10-shell.toml,
# so the button and the keybinding share one set of rules.
[widget.screenshot]
type = "screenshot"

    [widget.screenshot.actions]
    middle = "none"

# A plugin reference, <author>/<plugin>:<entry>, resolved through the community
# source in 50-services.toml.
#
# EXPECT ONE VALIDATOR WARNING FOR THIS LINE and do not chase it: `config
# validate` parses headlessly and never fetches, so it cannot resolve a type
# behind a git source. `noctalia msg plugins list` is the check that answers.
[widget.color_picker]
type = "oldirtty/color_picker:widget"

# 30-input.conf gives sway `us,ru` and cycles them with Alt+Shift; this glyph is
# the only thing on screen that says which is live. Left-click cycles too.
#
# `short` draws "US"; `full` draws "English (US)", which this strip has no room
# for. noctalia emits no default for it, so it is pinned.
[widget.keyboard_layout]
type    = "keyboard_layout"
display = "short"

# DEFINED BUT NOT PLACED. None of the four below is in `start` or `end` above --
# the bar matches what the settings GUI had. Adding one back is a single line.

[widget.swaymode]
type = "asinglebit/bazzite-sway:swaymode"

[widget.scratchpad]
type = "asinglebit/bazzite-sway:scratchpad"

[widget.failedunits]
type = "asinglebit/bazzite-sway:failedunits"

[widget.hardware]
type = "asinglebit/bazzite-sway:hardware"

[widget.output_volume]
type       = "volume"
device     = "output"
# One glyph, no percentage: the figure is in the OSD when the level changes and
# in the control centre when it does not.
show_label = false

    # Scroll works by default, so the glyph is a volume control without the
    # panel. Right-click keeps the one thing the panel cannot replace:
    # pavucontrol, for routing and profiles.
    [widget.output_volume.actions]
    left   = "panel-toggle control-center"
    right  = "run pavucontrol"
    middle = "volume-mute"

[widget.network]
type       = "network"
show_label = false

    [widget.network.actions]
    left   = "panel-toggle control-center"
    middle = "none"

[widget.bluetooth]
type = "bluetooth"

    # Routine pairing is noctalia's -- it is an org.bluez.Agent1. blueman-manager
    # stays as the deep pairing dialogue.
    [widget.bluetooth.actions]
    left   = "panel-toggle control-center"
    right  = "run blueman-manager"
    middle = "none"

[widget.notifications]
type = "notifications"

    [widget.notifications.actions]
    left   = "panel-toggle control-center"
    right  = "notification-dnd-toggle"
    middle = "notification-clear-active"

[widget.clock]
type   = "clock"
format = "{:%H:%M}"

    [widget.clock.actions]
    left   = "panel-toggle control-center"
    middle = "none"

# The one thing here with no state to read: it shows that sound is happening,
# which the volume glyph cannot -- a muted stream and a silent one look identical
# there. Draws in the palette, so on bazzite-grey it is motion in grey.
[widget.audio_visualizer]
type = "audio_visualizer"

    [widget.audio_visualizer.actions]
    middle = "none"
