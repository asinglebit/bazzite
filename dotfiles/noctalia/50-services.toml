# The lock screen and the idle daemon are one process, so there is nothing to sequence.
[idle]
behavior_order = [ "lock", "screen-off" ]

    [idle.behavior.lock]
    enabled = true
    action  = "lock"
    timeout = 300.0

    [idle.behavior.screen-off]
    enabled = true
    action  = "screen_off"
    timeout = 360.0

    # This machine never suspends on idle; lock_before_suspend covers the suspend path.
    [idle.behavior.lock-and-suspend]
    enabled = false

[lockscreen]
enabled              = true
lock_before_suspend  = true
allow_empty_password = false
# Blurs the desktop instead of loading an image, so the lock screen works before link-dotfiles has run.
blurred_desktop      = true
blur_intensity       = 0.5
tint_intensity       = 0.3
monitors             = []

# Off because sway already paints the wallpaper in 20-appearance.conf.
# Turning it on means two things painting one surface, and startup order picks the winner.
[wallpaper]
enabled = false

# Here rather than in the widget, so the control centre and the hardware plugin use the same numbers.
[system.monitor]
enabled = true

cpu_usage_activity_threshold = 80.0
cpu_usage_critical_threshold = 95.0
cpu_temp_activity_threshold  = 75.0
cpu_temp_critical_threshold  = 85.0
ram_pct_activity_threshold   = 85.0
ram_pct_critical_threshold   = 95.0

# Left empty on purpose: the thermal zones get renumbered by the kernel, so a written-down
# path would quietly start reading the wrong sensor. noctalia finds it and verify.sh says which.
cpu_temp_sensor_path = ""

cpu_poll_seconds    = 10.0
memory_poll_seconds = 10.0

# Off by default, since it tints a carefully grey palette; the shortcut below turns it on for an evening.
[nightlight]
enabled = false

[control_center]
show_session_button = true
sidebar             = "compact"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "nightlight"

    # The palette has no light variant, so if the desktop suddenly goes pale, this button is why.
    [[control_center.shortcuts]]
    type = "dark_mode"

# auto_update stays "none": a shell that updates itself in the background is no longer
# the thing the commit says it is. Installing when asked is fine, which is what `enabled` does.
# Only bazzite-sway is in this repo; the other five are fetched at first use and cached outside the image.
[plugins]
auto_update = "none"
enabled     = [
    # In the image.
    "asinglebit/bazzite-sway",
    # Fetched. `noctalia msg plugins list` reports which resolved.
    "yuuto/calculator",
    "oldirtty/color_picker",
    "ashur-d/nvim-projects",
    "neyfua/obs-integration",
    "davemhammer/obsidian",
]

    [[plugins.source]]
    name     = "bazzite-sway"
    kind     = "path"
    location = "~/.config/noctalia/plugins"
    enabled  = true

    [[plugins.source]]
    name     = "official"
    kind     = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    enabled  = true

    [[plugins.source]]
    name     = "community"
    kind     = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    enabled  = true
