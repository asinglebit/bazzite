# noctalia's lock screen and idle daemon are one process, so there is no command
# to block on and nothing to sequence. Both behaviours are off by default.
[idle]
behavior_order = [ "lock", "screen-off" ]

    [idle.behavior.lock]
    enabled = true
    action  = "lock"
    timeout = 300.0

    [idle.behavior.screen-off]
    enabled = true
    action  = "screen_off"
    timeout = 360.0

    # This machine does not suspend on idle; lock_before_suspend below covers
    # the suspend path.
    [idle.behavior.lock-and-suspend]
    enabled = false

[lockscreen]
enabled              = true
lock_before_suspend  = true
allow_empty_password = false
# Blurs the DESKTOP rather than loading an image, so it needs no path -- and so
# the lock screen does not depend on `just link-dotfiles` having run.
blurred_desktop      = true
blur_intensity       = 0.5
tint_intensity       = 0.3
monitors             = []

# OFF, for two reasons. [wallpaper] takes a DIRECTORY to cycle, not a file, and
# this desktop has one tracked PNG. And sway paints the background before
# anything else starts, so there is no window where the screen is bare.
#
# `output * bg` in 20-appearance.conf is the setter. Turning this on means two
# things painting one surface, with startup order picking the winner.
[wallpaper]
enabled = false

# Here rather than in the widget so the control centre and the
# bazzite-sway:hardware plugin colour against the same figures.
[system.monitor]
enabled = true

cpu_usage_activity_threshold = 80.0
cpu_usage_critical_threshold = 95.0
cpu_temp_activity_threshold  = 75.0
cpu_temp_critical_threshold  = 85.0
ram_pct_activity_threshold   = 85.0
ram_pct_critical_threshold   = 95.0

# EMPTY DELIBERATELY. thermal_zone0 here is `acpitz`, a chassis sensor sitting
# near 28C; the package sensor is zone 1 today. A path written down would break
# the first time the kernel reordered them, and break quietly. Left empty,
# noctalia discovers it and verify.sh reports which one it settled on.
cpu_temp_sensor_path = ""

cpu_poll_seconds    = 10.0
memory_poll_seconds = 10.0

# A gamma ramp over the whole output, against a calibrated grey palette. The
# control-centre shortcut below is how it gets turned on for an evening.
[nightlight]
enabled = false

[control_center]
show_session_button = true
sidebar             = "compact"

    [[control_center.shortcuts]]
    type = "wifi"

    [[control_center.shortcuts]]
    type = "bluetooth"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "nightlight"

    # CAVEAT: bazzite-grey.json defines a `dark` block and no `light` one, which
    # is why 20-theme.toml pins both modes to dark. This button reaches past
    # that, so a desktop that suddenly goes pale is this control, not a bug.
    [[control_center.shortcuts]]
    type = "dark_mode"

# TWO KNOBS, deliberately split. A source's `enabled` lets the shell resolve and
# install what the list below names, when asked. `auto_update` decides whether it
# goes back to GitHub on its own afterwards, and it stays "none": an image whose
# shell updates itself in the background is an image whose contents are not what
# the commit says they are.
#
# THE COST: only bazzite-sway is in this repo. The other five resolve from
# github.com at first use and cache under ~/.local/state/noctalia/plugin-cache,
# untracked and outside the image. Vendor one into dotfiles/noctalia/plugins and
# add a path source to pin it, as bazzite-sway does.
[plugins]
auto_update = "none"
enabled     = [
    # In the image.
    "asinglebit/bazzite-sway",
    # Fetched. `noctalia msg plugins list` reports which resolved.
    "yuuto/calculator",
    "oldirtty/color_picker",
    "ashur-d/nvim-projects",
    "neyfua/obs-integration",
    "davemhammer/obsidian",
]

    [[plugins.source]]
    name     = "bazzite-sway"
    kind     = "path"
    location = "~/.config/noctalia/plugins"
    enabled  = true

    [[plugins.source]]
    name     = "official"
    kind     = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    enabled  = true

    [[plugins.source]]
    name     = "community"
    kind     = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    enabled  = true
