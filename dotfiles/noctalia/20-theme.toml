# The palette is a copy of the greeter's, which holds the reasoning for every value.
# The two must stay equal or you see the colours change at login, and verify.sh checks that.
# Not "wallpaper": a palette generated from an image would wreck a deliberately grey desktop.
[theme]
source         = "custom"
custom_palette = "bazzite-grey"
mode           = "dark"
shell_mode     = "dark"

# Templates off because they do not just write a file: the gtk one edits this git tree
# through the symlink, and the sway one creates ~/.config/sway/config, which would
# shadow /etc/sway/config and leave a session with no bindings at all.
[theme.templates]
enable_builtin_templates   = false
enable_community_templates = false
builtin_ids                = []
community_ids              = []
