# One number for every surface noctalia draws, which is what 30-bar.toml points
# at rather than growing a per-connector table. The bar multiplies its own 0.75
# on top of this.
[accessibility]
ui_scale = 0.9

[shell]
# THE MOST CONSEQUENTIAL LINE HERE, and it is off by default. This is the only
# authentication agent on the machine -- mate-polkit is uninstalled and
# lxqt-policykit's drop-in is retired. With no agent, pkexec, ujust and
# bazzite-user-setup do not fail, they HANG, with no error anywhere.
polkit_agent = true

# Has to be a family fontconfig actually resolves: a miss is not an error, it is
# the whole shell quietly rendering in the fallback. 30-bar.toml overrides this
# for the bar alone.
font_family = "Noto Sans CJK SC"

# Scales the radii of elements INSIDE a surface -- list rows, buttons, sliders --
# which the compositor cannot reach. Deliberately tighter than the surface
# around it: at 1.0 a list row curves like the panel holding it.
corner_radius_scale = 0.7

# The only shadow the popups get. SwayFX's `shadows enable` applies to VIEWS; a
# layer surface gets only what its own layer_effects line asks for, and none of
# them asks for shadows.
popup_shadows = true

card_borders   = true
button_borders = true
input_borders  = true
popup_borders  = true

time_format = "{:%H:%M}"
date_format = "%A, %x"

# This is an image, not a first run -- the wizard would appear on every fresh
# install before `just link-dotfiles` had put this file in place.
setup_wizard_enabled = false
telemetry_enabled    = false

clipboard_enabled             = true
clipboard_history_max_entries = 100
clipboard_keep_from_closed_apps = true

    [shell.screenshot]
    freeze_screen       = true
    copy_to_clipboard   = true
    save_to_file        = true
    show_cursor         = false
    confirm_region      = false
    remember_last_region = true

    [shell.panel]
    # control_center_position is pinned rather than left at "auto" because FOUR
    # bar widgets open that one panel; "auto" anchored it under whichever glyph
    # was clicked, so it walked along the bar.
    control_center_placement = "attached"
    control_center_position  = "center"
    session_placement        = "attached"
    session_position         = "auto"
    launcher_placement       = "floating"
    launcher_position        = "center"
    clipboard_placement      = "floating"
    clipboard_position       = "center"
    polkit_placement         = "floating"
    polkit_position          = "center"
    floating_layer           = "overlay"
    borders                  = true
    shadow                   = false

    # This is what makes 25-effects.conf's blur visible at all: at "solid" the
    # compositor still runs a blur pass behind every panel and the panel paints
    # straight over it.
    transparency_mode        = "glass"

    # What "glass" costs -- over a translucent panel a bare list row loses its
    # edges against whatever shows through.
    list_item_background     = true

    # 16, down from the default 32, which is sized for a floating bar with a
    # margin. This bar spans the full width at the top edge, so a 32px curve bit
    # into the BAR's corners rather than the screen's.
    [shell.screen_corners]
    size = 16

    [shell.launcher]
    provider_prefix = "/"
    sort_by_usage   = true
    show_icons      = true
    categories      = true
    app_grid        = false
    compact         = false

    [shell.animation]
    enabled = true
    speed   = 1.0

    # Never: the greeter's /var copy is recreated from the image on every boot,
    # so a sync write does not survive a reboot. See 20-theme.toml.
    [shell.greeter_sync]
    auto_sync = false

[osd]
enabled            = true
position           = "top_center"
background_opacity = 0.72
border             = true
scale              = 1.0
monitors           = []

    [osd.kinds]
    volume             = true
    volume_output      = true
    volume_input       = true
    brightness         = true
    dnd                = true
    nightlight         = true
    caffeine           = true
    media              = true
    privacy            = true
    lock_keys          = true
    bluetooth          = true
    wifi               = true
    # No keyboard backlight on this desktop; the layout is on the bar instead.
    keyboard_backlight = false
    keyboard_layout    = false
    power_profile      = true

[notification]
enable_daemon      = true
position           = "top_right"
background_opacity = 0.72
border             = true
show_app_name      = true
show_actions       = true
collapse_on_dismiss = true
monitors           = []

# /sys/class/backlight is empty here -- both outputs are external -- so ddcutil
# talks to the monitors over I2C instead. See 40-bindings.conf.
[brightness]
enable_ddcutil     = true
sync_all_monitors  = false
minimum_brightness = 0.0
