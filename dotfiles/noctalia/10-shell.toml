# One scale for every surface the shell draws; the bar multiplies its own 0.75 on top.
[accessibility]
ui_scale = 0.9

[shell]
# The only password prompt on the machine, and off by default; without it pkexec and ujust just hang.
polkit_agent = true

# Must be a font that is actually installed, or the whole shell quietly renders in the fallback.
font_family = "Noto Sans CJK SC"

# Rounds things inside a panel, like buttons and list rows; tighter than the panel itself on purpose.
corner_radius_scale = 0.7

# The only shadow popups get, because SwayFX shadows apply to windows and not to panels.
popup_shadows = true

card_borders   = true
button_borders = true
input_borders  = true
popup_borders  = true

time_format = "{:%H:%M}"
date_format = "%A, %x"

# Off because this is an image: the wizard would greet every fresh install.
setup_wizard_enabled = false
telemetry_enabled    = false

clipboard_enabled             = true
clipboard_history_max_entries = 100
clipboard_keep_from_closed_apps = true

    [shell.screenshot]
    freeze_screen       = true
    copy_to_clipboard   = true
    save_to_file        = true
    show_cursor         = false
    confirm_region      = false
    remember_last_region = true

    [shell.panel]
    # Pinned rather than "auto" because four bar widgets open this one panel, so it used to wander.
    control_center_placement = "attached"
    control_center_position  = "center"
    session_placement        = "attached"
    session_position         = "auto"
    launcher_placement       = "floating"
    launcher_position        = "center"
    clipboard_placement      = "floating"
    clipboard_position       = "center"
    polkit_placement         = "floating"
    polkit_position          = "center"
    floating_layer           = "overlay"
    borders                  = true
    shadow                   = false

    # This is what makes the compositor's blur visible; at "solid" the panel just paints over it.
    transparency_mode        = "glass"

    # What "glass" costs: a bare list row loses its edges against whatever shows through.
    list_item_background     = true

    # Half the default, because this bar touches the top edge and a bigger curve bites into it.
    [shell.screen_corners]
    size = 16

    [shell.launcher]
    provider_prefix = "/"
    sort_by_usage   = true
    show_icons      = true
    categories      = true
    app_grid        = false
    compact         = false

    [shell.animation]
    enabled = true
    speed   = 1.0

    # Never, because the greeter's copy is recreated from the image on every boot anyway.
    [shell.greeter_sync]
    auto_sync = false

[osd]
enabled            = true
position           = "top_center"
background_opacity = 0.72
border             = true
scale              = 1.0
monitors           = []

    [osd.kinds]
    volume             = true
    volume_output      = true
    volume_input       = true
    brightness         = true
    dnd                = true
    nightlight         = true
    caffeine           = true
    media              = true
    privacy            = true
    lock_keys          = true
    bluetooth          = true
    wifi               = true
    # No keyboard backlight on a desktop, and the layout is already on the bar.
    keyboard_backlight = false
    keyboard_layout    = false
    power_profile      = true

[notification]
enable_daemon      = true
position           = "top_right"
background_opacity = 0.72
border             = true
show_app_name      = true
show_actions       = true
collapse_on_dismiss = true
monitors           = []

# Both monitors are external, so brightness goes over DDC/CI rather than /sys/class/backlight.
[brightness]
enable_ddcutil     = true
sync_all_monitors  = false
minimum_brightness = 0.0
