# The four things noctalia has no built-in widget for. If upstream grows any of
# them, delete the entry rather than keep it for symmetry.
#
# A widget is addressed as <id>:<widget id>, which is what 30-bar.toml lists.
id          = "asinglebit/bazzite-sway"
name        = "bazzite-sway"
version     = "1.0.0"
plugin_api  = 9
author      = "asinglebit"
license     = "MIT"
description = "Sway binding mode, scratchpad count, failed units, and hardware with an alert threshold."
tags        = [ "sway", "system" ]
icon        = "cpu"
dependencies = []

# cpu, memory and package temperature as one glyph, with the sensor found by name, not index.
# Thresholds are constants in hardware.luau, because a bad setting key would fail the whole plugin.
[[widget]]
id    = "hardware"
entry = "hardware.luau"

# waybar's `sway/mode`. Hidden in the default mode, so it costs nothing at rest.
[[widget]]
id    = "swaymode"
entry = "swaymode.luau"

# With no borders, this count is the only sign a window went to the scratchpad.
[[widget]]
id    = "scratchpad"
entry = "scratchpad.luau"

# Invisible until a unit fails, including noctalia.service, when there is no bar left to show it.
[[widget]]
id    = "failedunits"
entry = "failedunits.luau"
