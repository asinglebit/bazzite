# The four things noctalia has no built-in widget for. If upstream grows any of
# them, delete the entry rather than keep it for symmetry.
#
# A widget is addressed as <id>:<widget id>, which is what 30-bar.toml lists.
id          = "asinglebit/bazzite-sway"
name        = "bazzite-sway"
version     = "1.0.0"
plugin_api  = 9
author      = "asinglebit"
license     = "MIT"
description = "Sway binding mode, scratchpad count, failed units, and hardware with an alert threshold."
tags        = [ "sway", "system" ]
icon        = "cpu"
dependencies = []

# cpu, memory and package temperature as one glyph; figures in the tooltip, the
# alert in the glyph's colour. The sensor is found BY NAME, not by index.
#
# Thresholds are constants in hardware.luau rather than [[widget.setting]]
# entries: the manifest's setting schema is the one construct here that cannot
# be checked offline, and a bad key risks the whole plugin failing to load,
# taking all four widgets with it. They mirror [system.monitor] in
# 50-services.toml, which is what the control centre colours against.
[[widget]]
id    = "hardware"
entry = "hardware.luau"

# waybar's `sway/mode`. Hidden in the default mode, so it costs nothing at rest.
[[widget]]
id    = "swaymode"
entry = "swaymode.luau"

# 20-appearance.conf sets `default_border none`, so a window sent to the
# scratchpad leaves no trace on screen -- this count is the only feedback that
# the binding did anything. Hidden when empty.
[[widget]]
id    = "scratchpad"
entry = "scratchpad.luau"

# Invisible until a unit fails -- including noctalia.service, though by then
# there is no bar to show it.
[[widget]]
id    = "failedunits"
entry = "failedunits.luau"
