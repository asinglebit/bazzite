# Desktop appearance.
#
# /etc/sway/config sets `output * bg /usr/share/backgrounds/default.jxl fill`
# near the top of the file; the layered include that pulls this directory in
# runs at the very end, so this line simply wins.

# Flat dark grey, no image. Slightly lighter than the bar (#1a1a1a) so the bar
# reads as its own strip rather than blending into the desktop.
output * bg #242424 solid_color

# Window borders, titlebars and split indicators all painted the same grey as
# the desktop, so tiling edges disappear.
#
# The "indicator" slot is the split-direction hint sway draws on the edge where
# the next window will open -- included here, otherwise it stays bright blue and
# is the one bit of colour left on screen.
#
# Only the title *text* still varies, dim to bright, which is what tells you
# which window has focus now that no border does.
#
#                         border   backgr.  text     indicator child_border
client.focused            #242424  #242424  #d8d8d8  #242424   #242424
client.focused_inactive   #242424  #242424  #8a8a8a  #242424   #242424
client.unfocused          #242424  #242424  #6a6a6a  #242424   #242424
client.urgent             #242424  #242424  #ffffff  #242424   #242424
client.placeholder        #242424  #242424  #6a6a6a  #242424   #242424
client.background         #242424

# Sway's default is `normal 2`: a 2px border plus a titlebar on every window.
# `pixel 2` keeps the 2px frame -- painted #242424 above, so invisible against
# the desktop -- and drops the titlebar. Nothing is lost: waybar's centre module
# already shows the focused window's title, which is now the only thing that
# does, since no border varies with focus either.
#
# `none` instead of `pixel 2` would sit windows flush with no frame at all, at
# the cost of the 2px mouse grab area for resizing.
#
# Tabbed and stacked containers still draw a title bar regardless -- that is how
# the tabs are rendered, and default_border does not apply to them.
default_border pixel 2
default_floating_border pixel 2
