# /etc/sway/config sets its own wallpaper first, but this file is read last and wins.
# The colour at the end is what gets painted if the image is missing.
output * bg $HOME/.config/sway/wallpaper.png fill #242424

# All one grey so the tiling chrome disappears, and only the title text marks focus.
#                         border   backgr.  text     indicator child_border
client.focused            #242424  #242424  #d8d8d8  #242424   #242424
client.focused_inactive   #242424  #242424  #8a8a8a  #242424   #242424
client.unfocused          #242424  #242424  #6a6a6a  #242424   #242424
client.urgent             #242424  #242424  #ffffff  #242424   #242424

# No border or titlebar, so what separates two panes is the gap below showing wallpaper.
# The price is that there is no edge to grab: resize with the keyboard or $mod + right-drag.
default_border none
default_floating_border none

# Outer adds to inner, so the screen edge gets 12 while two panes meet at 8.
# A reload will not move existing windows; to apply now:
#     swaymsg gaps inner all set 8 && swaymsg gaps outer all set 4
gaps inner 8
gaps outer 4

# Tabbed and stacked containers draw a title bar anyway, and these are the only knobs that reach it.
# 1 rather than 0, because sway rejects `titlebar_padding 0 0` and then refuses to load at all.
titlebar_border_thickness 0
titlebar_padding 1 1

# Only tabbed and stacked titles use this; without it sway falls back to monospace 8.
font pango:Hack Nerd Font Mono 9
