# Desktop appearance.
#
# /etc/sway/config sets `output * bg /usr/share/backgrounds/default.jxl fill`
# near the top of the file; the layered include that pulls this directory in
# runs at the very end, so this line simply wins.

# The wallpaper ships in this repo, beside this config, and reaches
# ~/.config/sway/wallpaper.png via `just link-dotfiles` like every other file
# here. Keeping the image and the line that names it in the same repo is what
# lets the rule hold: the dotfiles repo is still not a dependency of the
# desktop. `.containerignore` excludes dotfiles/, so it never enters the image.
#
# `$HOME` expands -- sway runs a bg path through wordexp(), unlike most config
# values -- which keeps a username out of a committed file.
#
# `fill` scales to cover and crops the overflow, but nothing is cropped here:
# the image is 3840x2160, the Dell's exact native resolution, and the HP is the
# same 16:9, so it only downscales.
#
# The trailing colour is the *fallback*, painted only when the image cannot be
# loaded -- the state before the first `just link-dotfiles`. It is the flat
# #242424 this desktop used before, so the degraded case is the old look rather
# than black.
#
# One consequence worth knowing: the image's own field is #181818, a shade
# *darker* than the bar's #1a1a1a rather than lighter as the solid grey was, so
# the bar no longer reads as a strip separate from the desktop.
#
# That went further once SwayFX arrived. 25-effects.conf blurs the bar, the
# launcher and the notification centre, and waybar/style.css and
# rofi/config.rasi now draw their backgrounds at alpha so there is something
# for the blur to show through. So the bar's tone is no longer a fixed value at
# all -- it follows this image, frosted. If you swap the wallpaper for
# something light, the chrome goes with it.
output * bg $HOME/.config/sway/wallpaper.png fill #242424

# Titlebars and split indicators painted the same grey as the desktop, so what
# is left of the tiling chrome disappears.
#
# `default_border none` below means a normal window draws no border and no
# indicator at all, so most of this now only reaches tabbed and stacked
# containers, which keep their title bar regardless. It stays because that is
# precisely where stock sway would otherwise put bright blue on screen -- the
# "indicator" slot is the split-direction hint drawn on the edge where the next
# window will open.
#
# Only the title *text* still varies, dim to bright, which is what tells you
# which window has focus inside a tabbed container.
#
# Four classes and not six: `client.placeholder` and `client.background` were
# set here too, and sway does nothing with either. sway(5) says "Ignored
# (present for i3 compatibility)" of the first and "This command is ignored and
# is only present for i3 compatibility" of the second. Sway does log
#
#     [sway/commands/client.c] Warning: client.background is ignored by sway
#
# for each, at every config read -- but at INFO, and sway's default log level is
# ERROR, so it never surfaces. Nothing on screen changed when they went.
#
# `client.focused_tab_title` is the one supported class still left unset: given
# no value it falls back to focused_inactive, which is already the grey and the
# dim text this block wants for a tab that is not the focused one.
#
#                         border   backgr.  text     indicator child_border
client.focused            #242424  #242424  #d8d8d8  #242424   #242424
client.focused_inactive   #242424  #242424  #8a8a8a  #242424   #242424
client.unfocused          #242424  #242424  #6a6a6a  #242424   #242424
client.urgent             #242424  #242424  #ffffff  #242424   #242424

# Sway's default is `normal 2`: a 2px border plus a titlebar on every window.
# `none` drops both, so nothing is drawn around a window at all -- what
# separates two panes is the gap below, which is wallpaper showing through
# rather than a painted frame. Visually nothing is lost -- the 2px frame was
# painted #242424 above and was already invisible against the desktop -- and
# waybar's centre module still shows the focused window's title.
#
# The one real cost is the grab area `pixel 2` gave the mouse. Resizing is now
# the keyboard bindings, or `$mod` + right-drag, which works anywhere inside
# the window rather than only on a 2px edge.
default_border none
default_floating_border none

# 8px between adjacent panes, and 12px of wallpaper around the whole workspace.
#
# `gaps inner` is the gap BETWEEN two tiled windows rather than an inset on
# each: sway lays a row of n children out with a total of inner*(n-1) between
# them, so 8 is 8px on screen wherever two panes meet, at any split depth.
#
# THE OUTER NUMBER IS NOT THE EDGE MARGIN. sway(5): "Outer gaps are in addition
# to inner gaps. To reduce or remove outer gaps, outer gaps can be set to a
# negative value" -- and that addition happens with outer at its default 0 too,
# so `inner 8` on its own ALREADY insets the whole workspace by 8 on all four
# sides. outer 4 adds to that. What is actually on screen against the display
# edge and under the bar is inner + outer = 12, against an 8px channel where two
# panes meet.
#
# It was `inner 3` / `outer -3` before, summing to 0 and holding every window
# flush to the screen edge -- the seamless field the rest of this directory is
# built around. That went with the radius. At 25-effects.conf's corner_radius 9
# a window flush to the edge rounds its corners onto four notches of wallpaper
# with no channel to belong to; a margin gives the rounding something to sit
# inside, which is the argument `inner 3` already settled at the joins BETWEEN
# panes, now applied to the outside of the workspace as well.
#
# Sway clamps the sum at 0 rather than below it, so a negative outer can flatten
# the inset but cannot eat into the workspace: a lone window at inner 8 /
# outer -8 still fills its output edge to edge.
#
# Not `default_border pixel 8`, which is the other way to put a line between
# panes: that border is painted per window, so two adjacent panes would show
# 16px of it, and the outer edge of a row would show 8px against the screen
# where a gap shows the wallpaper.
#
# One thing to know when changing these numbers: `swaymsg reload` will NOT move
# the windows you are looking at. sway(5) says of the config-level command
# "This affects new workspaces only, and is used when the workspace doesn't
# have its own gaps settings" -- a workspace takes these values when it is
# created and keeps them, so a reload re-reads the file and the existing
# workspaces ignore it. Verified rather than assumed: a workspace set to 7
# stayed at 7 across a reload of this file. To see a change without logging
# out, follow the reload with
#
#     swaymsg gaps inner all set 8 && swaymsg gaps outer all set 4
#
# (that line used to need a `--` before the outer value, for swaymsg's own
# getopt, which read a bare -3 as a flag. A positive number does not.)
gaps inner 8
gaps outer 4

# Tabbed and stacked containers draw a title bar regardless -- that is how the
# tabs are rendered, and default_border does not reach them. These two are the
# only knobs that do, so this is as flat as that bar gets.
#
# 1 and not 0: sway's parser rejects `titlebar_padding 0 0` outright ("Invalid
# size specified") and then refuses to load the config at all. 1 is the floor.
titlebar_border_thickness 0
titlebar_padding 1 1

# Sway's own font. Tabbed and stacked container titles are the only place it
# still renders, per the note above -- everything else lost its titlebar to
# `default_border none`. There was no `font` line anywhere in the include
# chain before this, so sway was using its compiled-in default of
# `monospace 8`.
#
# 9 rather than 8 to sit nearer the 11px the bar and the launcher use. The
# fontconfig alias in dotfiles/fontconfig/fonts.conf would already resolve a
# bare `monospace` to the same face; naming the family makes it explicit.
font pango:Hack Nerd Font Mono 9
