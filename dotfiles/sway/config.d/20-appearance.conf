# Desktop appearance.
#
# /etc/sway/config sets `output * bg /usr/share/backgrounds/default.jxl fill`
# near the top of the file; the layered include that pulls this directory in
# runs at the very end, so this line simply wins.

# The wallpaper ships in this repo, beside this config, and reaches
# ~/.config/sway/wallpaper.png via `just link-dotfiles` like every other file
# here. Keeping the image and the line that names it in the same repo is what
# lets the rule hold: the dotfiles repo is still not a dependency of the
# desktop. `.containerignore` excludes dotfiles/, so it never enters the image.
#
# `$HOME` expands -- sway runs a bg path through wordexp(), unlike most config
# values -- which keeps a username out of a committed file.
#
# `fill` scales to cover and crops the overflow, but nothing is cropped here:
# the image is 3840x2160, the Dell's exact native resolution, and the HP is the
# same 16:9, so it only downscales.
#
# The trailing colour is the *fallback*, painted only when the image cannot be
# loaded -- the state before the first `just link-dotfiles`. It is the flat
# #242424 this desktop used before, so the degraded case is the old look rather
# than black.
#
# One consequence worth knowing: the image's own field is #181818, a shade
# *darker* than the bar's #1a1a1a rather than lighter as the solid grey was, so
# the bar no longer reads as a strip separate from the desktop.
output * bg $HOME/.config/sway/wallpaper.png fill #242424

# Titlebars and split indicators painted the same grey as the desktop, so what
# is left of the tiling chrome disappears.
#
# `default_border none` below means a normal window draws no border and no
# indicator at all, so most of this now only reaches tabbed and stacked
# containers, which keep their title bar regardless. It stays because that is
# precisely where stock sway would otherwise put bright blue on screen -- the
# "indicator" slot is the split-direction hint drawn on the edge where the next
# window will open -- and because client.background is not a border at all.
#
# Only the title *text* still varies, dim to bright, which is what tells you
# which window has focus inside a tabbed container.
#
#                         border   backgr.  text     indicator child_border
client.focused            #242424  #242424  #d8d8d8  #242424   #242424
client.focused_inactive   #242424  #242424  #8a8a8a  #242424   #242424
client.unfocused          #242424  #242424  #6a6a6a  #242424   #242424
client.urgent             #242424  #242424  #ffffff  #242424   #242424
client.placeholder        #242424  #242424  #6a6a6a  #242424   #242424
client.background         #242424

# Sway's default is `normal 2`: a 2px border plus a titlebar on every window.
# `none` drops both, so windows sit flush against each other and against the
# desktop with nothing drawn in between. Visually nothing is lost -- the 2px
# frame was painted #242424 above and was already invisible against the
# desktop -- and waybar's centre module still shows the focused window's title.
#
# The one real cost is the grab area `pixel 2` gave the mouse. Resizing is now
# the keyboard bindings, or `$mod` + right-drag, which works anywhere inside
# the window rather than only on a 2px edge.
default_border none
default_floating_border none

# Tabbed and stacked containers draw a title bar regardless -- that is how the
# tabs are rendered, and default_border does not reach them. These two are the
# only knobs that do, so this is as flat as that bar gets.
#
# 1 and not 0: sway's parser rejects `titlebar_padding 0 0` outright ("Invalid
# size specified") and then refuses to load the config at all. 1 is the floor.
titlebar_border_thickness 0
titlebar_padding 1 1

# Sway's own font. Tabbed and stacked container titles are the only place it
# still renders, per the note above -- everything else lost its titlebar to
# `default_border none`. There was no `font` line anywhere in the include
# chain before this, so sway was using its compiled-in default of
# `monospace 8`.
#
# 9 rather than 8 to sit nearer the 11px the bar and the launcher use. The
# fontconfig alias in dotfiles/fontconfig/fonts.conf would already resolve a
# bare `monospace` to the same face; naming the family makes it explicit.
font pango:Hack Nerd Font Mono 9
