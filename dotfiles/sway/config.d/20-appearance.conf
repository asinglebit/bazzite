# /etc/sway/config sets its own `output * bg` near the top; the layered include
# runs last, so this wins. `$HOME` expands because sway runs bg paths through
# wordexp(). The trailing colour is the fallback painted when the image is
# missing -- the state before the first `just link-dotfiles`.
output * bg $HOME/.config/sway/wallpaper.png fill #242424

# Everything painted the desktop grey so the tiling chrome disappears. The
# `indicator` slot is the split-direction hint, and the one place stock sway
# would otherwise put bright blue on screen. Only the title text varies, which
# is what marks focus inside a tabbed container.
#
# client.focused_tab_title is left unset deliberately: it falls back to
# focused_inactive, which is already the grey and dim text this wants.
#
#                         border   backgr.  text     indicator child_border
client.focused            #242424  #242424  #d8d8d8  #242424   #242424
client.focused_inactive   #242424  #242424  #8a8a8a  #242424   #242424
client.unfocused          #242424  #242424  #6a6a6a  #242424   #242424
client.urgent             #242424  #242424  #ffffff  #242424   #242424

# No border and no titlebar on a normal window; what separates two panes is the
# gap below, showing wallpaper. Cost: the 2px mouse grab area is gone, so
# resizing is the keyboard bindings or $mod + right-drag.
default_border none
default_floating_border none

# OUTER IS IN ADDITION TO INNER, including at outer's default of 0 -- `inner 8`
# alone already insets the workspace by 8 on all four sides. So the screen edge
# gets inner + outer = 12, and two panes meet at 8.
#
# `swaymsg reload` will NOT move existing windows: a workspace takes these
# values when it is created and keeps them. To apply without logging out:
#
#     swaymsg gaps inner all set 8 && swaymsg gaps outer all set 4
gaps inner 8
gaps outer 4

# Tabbed and stacked containers draw a title bar regardless -- default_border
# does not reach them, and these are the only two knobs that do.
#
# 1, not 0: sway's parser rejects `titlebar_padding 0 0` and then refuses to
# load the config at all.
titlebar_border_thickness 0
titlebar_padding 1 1

# Only renders on tabbed and stacked titles now. Without this sway uses its
# compiled-in `monospace 8`.
font pango:Hack Nerd Font Mono 9
