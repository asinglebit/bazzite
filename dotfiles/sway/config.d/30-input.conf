# type:keyboard rather than an identifier: get_inputs reports five keyboard
# devices here, and identifiers change when a device is replugged.
#
# grp: is compiled into the keymap rather than bound with bindsym, so it still
# switches while the session is locked, where sway inhibits bindings. It fires
# only on Alt+Shift pressed alone, so Alt+Shift+Tab is unaffected.
input type:keyboard {
    xkb_layout  "us,ru"
    xkb_options "grp:alt_shift_toggle"
}
