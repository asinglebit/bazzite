# SwayFX extensions. Stock sway's parser REJECTS every directive here and then
# refuses to load the config at all, so this file has to go if the compositor
# ever goes back to Fedora's sway.
#
# Effects apply to the chrome, not to windows. Application windows stay opaque.

# Rounding needs a channel to round against: with `default_border none` and no
# gaps, flush panes expose notches of desktop grey where corners meet. So this
# and 20-appearance.conf's gaps move together -- raising one without the other
# brings the notches back.
#
# This number also appears in the four layer_effects lines below. Change it here
# and the panels stop agreeing with the windows.
#
# A reload does not re-round existing windows, but they can be pushed:
#
#     swaymsg '[tiling] corner_radius 9'
corner_radius 9

# Blur is only visible THROUGH a translucent surface, so enabling it globally
# costs nothing by itself -- the visible effect is entirely the layer_effects
# lines at the bottom plus the alpha the shell paints at.
blur enable

# There is no per-surface strength control, so this one pair sets how blurred
# everything behind every translucent surface is. radius is the smooth knob,
# passes the coarse and cheaper one -- lower passes first if the bar feels
# sluggish on this GPU.
blur_passes 2
blur_radius 3

# Noise breaks up banding on large flat blurs over a dark palette; brightness
# under 1 keeps the frosted bar from reading lighter than it is painted.
blur_noise 0.02
blur_brightness 0.9

# THE ONE EFFECT HERE THAT IS NOT POLISH. 20-appearance.conf sets
# `default_border none`, so nothing on screen marks which window has focus.
# Dimming restores the cue without putting chrome back.
#
# The dim is an alpha blend of the colour below OVER the window, so the colour
# decides what "dimmed" means: near-black only darkens, while a neutral grey
# pulls every channel toward one value and takes out some chroma too. There is
# no saturation filter for window content in SwayFX, so this is the whole
# mechanism.
#
# As with the gaps, a reload leaves existing views at their old value:
#
#     swaymsg '[tiling] dim_inactive 0.25'
default_dim_inactive 0.25
dim_inactive_colors.unfocused #2e2e2e
dim_inactive_colors.urgent    #ffffff

shadows enable

# GTK and other CSD apps draw their own shadow; ours on top gives a double halo.
shadows_on_csd disable

# Against an 8px gap, two adjacent panes cast most of their shadow into the same
# channel -- lower the radius if the channels read as dark seams.
shadow_blur_radius 20
shadow_offset 0 2
shadow_color #00000060
shadow_inactive_color #00000040

# layer_effects matches the layer-shell NAMESPACE, not app_id -- a layer surface
# has none. The namespaces below were read out of /usr/bin/noctalia, and
# 18-noctalia-shell.sh asserts each is still there at build time: an upstream
# rename does not error, it silently stops blurring one surface.
#
# These lines are the ONLY blur the shell gets. noctalia asks for
# ext_background_effect_manager_v1 to blur behind itself and SwayFX does not
# advertise it.

# corner_radius 0: the bar spans the full width at the top edge, so rounding
# would notch its corners against the screen. Suffix is the bar's name in
# 30-bar.toml -- a second bar would need a second line.
layer_effects "noctalia-bar-default" blur enable; corner_radius 0

# blur_ignore_transparent IS LOAD-BEARING on every panel below. Each takes a
# surface far larger than what it paints, and blur applies to what is behind the
# SURFACE, so without this one option an open panel frosts the entire screen for
# as long as it is mapped. It limits the blur to fully-painted regions; anything
# at partial alpha is still frosted.
#
# Both panel namespaces are needed: 10-shell.toml decides per panel whether it
# floats or anchors under the bar widget that opened it.
layer_effects "noctalia-panel"          blur enable; blur_ignore_transparent enable; corner_radius 9
layer_effects "noctalia-attached-panel" blur enable; blur_ignore_transparent enable; corner_radius 9
layer_effects "noctalia-osd"            blur enable; blur_ignore_transparent enable; corner_radius 9
layer_effects "noctalia-notification"   blur enable; blur_ignore_transparent enable; corner_radius 9

# DELIBERATELY ABSENT. noctalia-backdrop, -click-shield, -panel-click-shield and
# -screen-corner are full-output surfaces: corner_radius there rounds the SCREEN,
# shadows draw where nobody can see them, and blur computes a full-screen pass to
# show nothing. The two widget editors are transient, and blurring
# noctalia-screenshot-region would blur the thing being selected.
#
# The lock screen is absent because [lockscreen] blurred_desktop makes noctalia
# blur its own snapshot -- compositing an image it already holds, rather than
# asking the compositor what is behind it.
