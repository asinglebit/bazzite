# SwayFX effects.
#
# Only loaded because build_files/15-swayfx.sh swapped the sway package for
# swayfx. Every directive here is a SwayFX extension -- stock sway's parser
# rejects them outright and refuses to load the config, so if the compositor
# ever goes back to Fedora's sway this file has to go with it.
#
# The shape of the decision: effects are applied to the CHROME, not to windows.
# Application windows stay fully opaque, which is what keeps the desktop
# readable and the GPU cost bounded to three layer surfaces.
#
# Palette, dark to light, shared with waybar/style.css and rofi/config.rasi:
#   #1a1a1a  the darkest surface -- bar, launcher, terminal
#   #242424  the desktop grey
#   #ffffff  alert
#
# Numbered 25 so it lands after 20-appearance.conf (which sets
# `default_border none`, the thing that makes dim_inactive necessary) and before
# 40-bindings.conf.

# --- Corner radius -----------------------------------------------------------
#
# 8px, which is also rofi's window rounding via layer_effects below, swaync's
# --border-radius, and hyprlock's input-field `rounding`. One number for every
# rounded thing on the desktop.
#
# Worth knowing before tuning: rounding needs something to round against. With
# `default_border none` and no gaps, tiled windows sat flush and their rounded
# corners exposed small notches of desktop grey where two windows met -- an
# artifact in an otherwise seamless field. 20-appearance.conf's `gaps inner 3`
# is what settled that: a notch now opens onto the gap instead of into a flush
# join, so it reads as part of the channel between panes. Take the gaps back
# out and they are notches again.
corner_radius 8

# --- Blur --------------------------------------------------------------------
#
# Blur is only visible THROUGH a translucent surface -- it blurs whatever is
# behind a window, so with an opaque background above it there is nothing to
# see. Enabling it globally therefore costs nothing on its own; the visible
# effect comes entirely from the layer_effects lines at the bottom of this file
# plus the rgba() backgrounds in waybar/style.css, rofi/config.rasi and
# swaync/style.css.
blur enable

# 2 passes at radius 3, down from radius 5: a haze you can still see the desktop
# through rather than a frost that erases it. Strength is roughly passes x
# radius, and there is no per-surface control -- `layer_effects` can turn blur on
# and off for a namespace but not weaken it -- so this one pair sets how blurred
# everything behind every translucent surface is: the bar, the launcher, the
# notification panel and its popups alike.
#
# Which way to turn it: radius is the smooth knob and passes is the coarse one.
# radius 5 is the old frost; passes 1 is a distinctly lighter effect than
# anything radius alone will give, and also the cheaper direction -- this box
# drives a 3840x2160 panel at scale 2 alongside a 1080p one, through SwayFX's
# GLES2 fx_renderer on nvidia-open, so passes is the first thing to lower if the
# bar ever feels sluggish.
blur_passes 2
blur_radius 3

# A trace of noise breaks up the banding that large flat blurs show on a dark
# palette. brightness slightly under 1 keeps the frosted bar from reading
# lighter than the #1a1a1a it is nominally painted.
blur_noise 0.02
blur_brightness 0.9

# --- Dim inactive ------------------------------------------------------------
#
# This is the one effect here that fixes a real usability problem rather than
# adding polish. 20-appearance.conf sets `default_border none`, so a normal
# window draws no border, no titlebar and no split indicator -- which means
# NOTHING on screen says which window has focus except waybar's centre module.
#
# Dimming the unfocused ones restores that cue without putting chrome back, and
# it signals with brightness rather than hue, which is the rule the bar, the
# launcher and the lock screen all already follow.
#
# 0.25, and dimmed TOWARDS A GREY rather than towards black, which is what
# takes a little of the colour out of an unfocused pane as well as a little of
# the light.
#
# Those are one setting, not two, because of how SwayFX draws this: the dim is
# an alpha blend of dim_inactive_colors.unfocused over the window, so the colour
# decides what "dimmed" means. #1a1a1a, near black, only darkened. #2e2e2e --
# the hairline grey from the shared palette -- pulls every channel toward the
# same value, so a saturated pixel loses a quarter of its chroma at 0.25 while a
# near-black one lifts by about 11/255, which is nothing. Verified rather than
# assumed: the same unfocused window measured mean 45 against #1a1a1a and 52
# against #4a4a4a, so the blend really is toward the colour.
#
# There is no saturation control to reach for instead. `strings /usr/bin/sway`
# has blur_saturation and nothing else -- SwayFX can desaturate what it blurs
# behind a translucent surface, but it has no filter for window content, so a
# neutral dim colour is the whole of the mechanism.
#
# And since sway leaves focus_follows_mouse at its default of yes, moving the
# pointer onto a pane focuses it: this is the hover response for windows, not
# just the focus one.
#
# 0.25 is still meant to be subtle -- enough to see at a glance which pane is
# live, not enough to make an unfocused terminal hard to read while you copy
# from it. It is also the ceiling for readability: much past this and the grey
# starts washing dark text rather than dimming it.
#
# ONE THING TO KNOW WHEN CHANGING THE NUMBER: `swaymsg reload` will not move
# windows that already exist, exactly as with the gaps in 20-appearance.conf.
# `default_dim_inactive` is the default for a NEW view, and each view keeps the
# value it was created with -- measured: raising it from 0.15 to 0.25 at runtime
# left every open window at 0.15. The colour, by contrast, is global and takes
# effect at once. To apply a new dim to what is already on screen:
#
#     swaymsg '[tiling] dim_inactive 0.25'
default_dim_inactive 0.25
dim_inactive_colors.unfocused #2e2e2e
dim_inactive_colors.urgent    #ffffff

# --- Shadows -----------------------------------------------------------------
#
# Shadows separate FLOATING windows from what is behind them. Tiled windows sit
# flush so there is nothing for a shadow to fall on; this is really for the
# floating dialogs sway's own rules create (pavucontrol, the polkit agent) and
# for anything sent to the scratchpad.
shadows enable

# Client-side-decorated windows draw their own shadow already -- GTK apps in
# particular -- and stacking ours on top gives them a visible double halo.
shadows_on_csd disable

shadow_blur_radius 20
shadow_offset 0 2
# 0x60 alpha, the same value hyprlock's background brightness and swaync's
# --notification-shadow are set against.
shadow_color #00000060
shadow_inactive_color #00000040

# --- Layer surfaces ----------------------------------------------------------
#
# This is where the blur above becomes visible. `layer_effects <namespace>
# <effects>` matches on the layer-shell namespace the client requests, NOT on
# app_id -- a layer surface has no app_id.
#
# The namespaces were read out of the binaries rather than guessed:
# `strings /usr/bin/swaync` yields swaync-control-center and
# swaync-notification-window; waybar and rofi use their own names.
#
# If a surface here is NOT blurred at runtime, the namespace is wrong rather
# than the blur being broken -- check what the client actually calls itself
# before touching the blur_* values above.

# The bar. corner_radius 0 because it spans the full width at the top edge, so
# rounding would notch its top two corners against the screen edge.
layer_effects "waybar" blur enable; corner_radius 0

# --- blur_ignore_transparent, and why rofi has it ---------------------------
#
# A layer surface is usually much bigger than what it draws. rofi -- like
# swaync before it stopped being blurred at all, below -- takes a surface the
# size of the whole output and paints its window somewhere inside it, leaving
# the rest fully transparent. Blur applies to what is behind THE SURFACE, not
# behind the pixels, so `blur enable` on such a surface frosts the entire
# screen for as long as it is mapped. That is not a subtlety: measured with
# swaync's panel open and this option off, a window region on the far side of
# the screen scored 50.7 on a Laplacian sharpness metric against 233.8 with it
# on, and the bar's own glyphs smeared into blobs.
#
# `blur_ignore_transparent enable` limits the blur to the parts of the surface
# that are actually painted -- fully transparent regions only; anything at an
# alpha between 0 and 1 is still frosted.
#
# waybar is left out on purpose: its surface IS the bar, painted edge to edge,
# so there is no transparent region to skip and nothing to gain.

# The launcher. rofi/config.rasi carries `border: 1px` in #2e2e2e, so the
# rounding here has to match that hairline or the border corners square off
# around a rounded fill.
layer_effects "rofi" blur enable; blur_ignore_transparent enable; corner_radius 8

# --- swaync gets NO effects at all ------------------------------------------
#
# There were two lines here, blurring the notification centre and the
# notification popups. They are gone rather than set to `blur disable`, because
# with the blur off there was nothing else on them worth keeping:
#
#   corner_radius rounds the SURFACE, and both of swaync's surfaces are the
#   whole output -- so it was rounding the screen's corners, not the panel's.
#   The panel's own corners come from border-radius in swaync/style.css.
#
#   shadows draws around the surface too, so on a full-output transparent
#   surface it drew a shadow nobody can see. The cards' shadows come from
#   `box-shadow` in the same stylesheet.
#
# The panel and its popups are opaque now (--section-bg and --noti-bg-alpha in
# swaync/style.css), which is what "no frosted surfaces" means in practice:
# nothing to blur through, so nothing to compute. To put the frost back, both
# halves have to come back -- the alphas there, and a `layer_effects
# "swaync-control-center" blur enable; blur_ignore_transparent enable` here.
