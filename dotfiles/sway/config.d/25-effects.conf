# SwayFX only: stock sway rejects every line here and then refuses to load the config at all.
# These effects apply to the chrome, not to application windows, which stay opaque.

# Rounding needs a gap to round against, so this moves together with 20-appearance.conf's gaps.
# The same number appears in the layer_effects lines below, and they have to agree.
# A reload does not re-round open windows: swaymsg '[tiling] corner_radius 9'
corner_radius 9

# Blur only shows through something translucent, so on its own this costs nothing.
blur enable

# One setting for everything; drop passes first if the bar ever feels sluggish.
blur_passes 2
blur_radius 3

# Noise hides banding on big flat blurs, and the dimming keeps the bar from looking lighter than it is.
blur_noise 0.02
blur_brightness 0.9

# The one effect here that is not polish: with no borders, dimming is what shows which window has focus.
# The colour is blended over the window, so a neutral grey also washes out some colour, unlike near-black.
# A reload leaves open windows alone: swaymsg '[tiling] dim_inactive 0.25'
default_dim_inactive 0.25
dim_inactive_colors.unfocused #2e2e2e
dim_inactive_colors.urgent    #ffffff

shadows enable

# GTK apps draw their own shadow, and ours on top gives a double halo.
shadows_on_csd disable

# Two panes share one 8px gap, so lower the radius if the gaps start reading as dark seams.
shadow_blur_radius 20
shadow_offset 0 2
shadow_color #00000060
shadow_inactive_color #00000040

# These match the shell's layer-shell namespaces, which were read out of the noctalia binary.
# 18-noctalia-shell.sh checks each still exists, because a rename would silently stop blurring one.

# corner_radius 0 because the bar spans the full width and rounding would notch it against the screen.
layer_effects "noctalia-bar-default" blur enable; corner_radius 0

# blur_ignore_transparent is load-bearing: each panel claims a surface far bigger than it paints,
# so without it an open panel frosts the whole screen for as long as it is up.
layer_effects "noctalia-panel"          blur enable; blur_ignore_transparent enable; corner_radius 9
layer_effects "noctalia-attached-panel" blur enable; blur_ignore_transparent enable; corner_radius 9
layer_effects "noctalia-osd"            blur enable; blur_ignore_transparent enable; corner_radius 9
layer_effects "noctalia-notification"   blur enable; blur_ignore_transparent enable; corner_radius 9

# The full-screen surfaces are left out on purpose: rounding them would round the screen itself.
# The lock screen is out too, because noctalia blurs its own snapshot instead of asking the compositor.
