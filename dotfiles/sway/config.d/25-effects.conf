# SwayFX effects.
#
# Only loaded because build_files/15-swayfx.sh swapped the sway package for
# swayfx. Every directive here is a SwayFX extension -- stock sway's parser
# rejects them outright and refuses to load the config, so if the compositor
# ever goes back to Fedora's sway this file has to go with it.
#
# The shape of the decision: effects are applied to the CHROME, not to windows.
# Application windows stay fully opaque, which is what keeps the desktop
# readable and the GPU cost bounded to three layer surfaces.
#
# Palette, dark to light, shared with waybar/style.css and rofi/config.rasi:
#   #1a1a1a  the darkest surface -- bar, launcher, terminal
#   #242424  the desktop grey
#   #ffffff  alert
#
# Numbered 25 so it lands after 20-appearance.conf (which sets
# `default_border none`, the thing that makes dim_inactive necessary) and before
# 40-bindings.conf.

# --- Corner radius -----------------------------------------------------------
#
# 9px, and still ONE number for every rounded thing on the desktop: the panels,
# the OSD and the notifications all take it again through layer_effects at the
# bottom of this file. (rofi's window rounding, swaync's --border-radius and
# hyprlock's input-field `rounding` used to be on that list at 8px. All three are
# retired.)
#
# Worth knowing before tuning: rounding needs something to round against. With
# `default_border none` and no gaps, tiled windows sat flush and their rounded
# corners exposed small notches of desktop grey where two windows met -- an
# artifact in an otherwise seamless field. 20-appearance.conf's gaps are what
# settle that: a notch opens onto the gap instead of into a flush join, so it
# reads as part of the channel between panes. Take the gaps back out and they
# are notches again.
#
# SO THE RADIUS AND THE GAPS MOVE TOGETHER. Raising the radius on its own puts a
# curve into a channel too narrow to hold it and the notches come straight back --
# and once the workspace had a margin, at the four screen corners as well, which
# the old flush edges had no gap to open onto at all. That is why outer went
# positive when this went up.
#
# It does NOT follow that the gaps come back down when the radius does. This
# settled at 9 after being tried at 12, and the 8px channel stayed: the margin
# turned out to be worth having on its own, and 9 is a curve small enough to sit
# inside it with room to spare. Judged on screen -- there is no arithmetic that
# picks between 9 and 10 here, only a look at two panes meeting.
#
# noctalia is scaled to match from the other side rather than left to drift:
# dotfiles/noctalia/10-shell.toml sets corner_radius_scale 0.7, so the elements
# INSIDE a panel got tighter as the panel itself got rounder.
#
# One thing to know when changing the number, and it is the good half of the
# dim_inactive trap below rather than the bad half: `swaymsg reload` does not
# re-round the windows already on screen either, but unlike default_dim_inactive
# this one can be pushed onto them, and the push is accepted rather than silently
# ignored. Verified against this session:
#
#     $ swaymsg '[tiling] corner_radius 9'
#     [ { "success": true } ]
#
# The gaps in 20-appearance.conf need the same treatment in the same breath --
# that file carries the two commands -- because a new radius in an old channel is
# exactly the notch case above.
corner_radius 9

# --- Blur --------------------------------------------------------------------
#
# Blur is only visible THROUGH a translucent surface -- it blurs whatever is
# behind a window, so with an opaque background above it there is nothing to
# see. Enabling it globally therefore costs nothing on its own; the visible
# effect comes entirely from the layer_effects lines at the bottom of this file
# plus the rgba() backgrounds in waybar/style.css, rofi/config.rasi and
# swaync/style.css.
blur enable

# 2 passes at radius 3, down from radius 5: a haze you can still see the desktop
# through rather than a frost that erases it. Strength is roughly passes x
# radius, and there is no per-surface control -- `layer_effects` can turn blur on
# and off for a namespace but not weaken it -- so this one pair sets how blurred
# everything behind every translucent surface is: the bar, the launcher, the
# notification panel and its popups alike.
#
# Which way to turn it: radius is the smooth knob and passes is the coarse one.
# radius 5 is the old frost; passes 1 is a distinctly lighter effect than
# anything radius alone will give, and also the cheaper direction -- this box
# drives a 3840x2160 panel at scale 2 alongside a 1080p one, through SwayFX's
# GLES2 fx_renderer on nvidia-open, so passes is the first thing to lower if the
# bar ever feels sluggish.
blur_passes 2
blur_radius 3

# A trace of noise breaks up the banding that large flat blurs show on a dark
# palette. brightness slightly under 1 keeps the frosted bar from reading
# lighter than the #1a1a1a it is nominally painted.
blur_noise 0.02
blur_brightness 0.9

# --- Dim inactive ------------------------------------------------------------
#
# This is the one effect here that fixes a real usability problem rather than
# adding polish. 20-appearance.conf sets `default_border none`, so a normal
# window draws no border, no titlebar and no split indicator -- which means
# NOTHING on screen says which window has focus except waybar's centre module.
#
# Dimming the unfocused ones restores that cue without putting chrome back, and
# it signals with brightness rather than hue, which is the rule the bar, the
# launcher and the lock screen all already follow.
#
# 0.25, and dimmed TOWARDS A GREY rather than towards black, which is what
# takes a little of the colour out of an unfocused pane as well as a little of
# the light.
#
# Those are one setting, not two, because of how SwayFX draws this: the dim is
# an alpha blend of dim_inactive_colors.unfocused over the window, so the colour
# decides what "dimmed" means. #1a1a1a, near black, only darkened. #2e2e2e --
# the hairline grey from the shared palette -- pulls every channel toward the
# same value, so a saturated pixel loses a quarter of its chroma at 0.25 while a
# near-black one lifts by about 11/255, which is nothing. Verified rather than
# assumed: the same unfocused window measured mean 45 against #1a1a1a and 52
# against #4a4a4a, so the blend really is toward the colour.
#
# There is no saturation control to reach for instead. `strings /usr/bin/sway`
# has blur_saturation and nothing else -- SwayFX can desaturate what it blurs
# behind a translucent surface, but it has no filter for window content, so a
# neutral dim colour is the whole of the mechanism.
#
# And since sway leaves focus_follows_mouse at its default of yes, moving the
# pointer onto a pane focuses it: this is the hover response for windows, not
# just the focus one.
#
# 0.25 is still meant to be subtle -- enough to see at a glance which pane is
# live, not enough to make an unfocused terminal hard to read while you copy
# from it. It is also the ceiling for readability: much past this and the grey
# starts washing dark text rather than dimming it.
#
# ONE THING TO KNOW WHEN CHANGING THE NUMBER: `swaymsg reload` will not move
# windows that already exist, exactly as with the gaps in 20-appearance.conf.
# `default_dim_inactive` is the default for a NEW view, and each view keeps the
# value it was created with -- measured: raising it from 0.15 to 0.25 at runtime
# left every open window at 0.15. The colour, by contrast, is global and takes
# effect at once. To apply a new dim to what is already on screen:
#
#     swaymsg '[tiling] dim_inactive 0.25'
default_dim_inactive 0.25
dim_inactive_colors.unfocused #2e2e2e
dim_inactive_colors.urgent    #ffffff

# --- Shadows -----------------------------------------------------------------
#
# Shadows separate a window from what is behind it. This used to be a statement
# about FLOATING windows only -- the floating dialogs sway's own rules create
# (pavucontrol, the polkit agent) and anything sent to the scratchpad -- because
# tiled windows sat flush at `gaps outer -3` and there was no surface for a
# shadow to fall on.
#
# THAT IS NO LONGER TRUE. 20-appearance.conf now opens an 8px channel between
# panes and a 12px margin around the workspace, so every tiled window casts into
# them as well, and there is no knob to separate the two cases: SwayFX has
# `shadows`, `shadows_on_csd` and the four shadow_* parameters below, and nothing
# that distinguishes tiled from floating.
#
# The number to reach for if the channels read as dark seams rather than as
# wallpaper is shadow_blur_radius below -- 20 against an 8px gap means two
# adjacent panes both cast most of their shadow into the same channel.
shadows enable

# Client-side-decorated windows draw their own shadow already -- GTK apps in
# particular -- and stacking ours on top gives them a visible double halo.
shadows_on_csd disable

shadow_blur_radius 20
shadow_offset 0 2
# 0x60 alpha, the same value hyprlock's background brightness and swaync's
# --notification-shadow are set against.
shadow_color #00000060
shadow_inactive_color #00000040

# --- Layer surfaces ----------------------------------------------------------
#
# This is where the blur above becomes visible. `layer_effects <namespace>
# <effects>` matches on the layer-shell namespace the client requests, NOT on
# app_id -- a layer surface has no app_id.
#
# The namespaces were read out of the binaries rather than guessed:
# `strings /usr/bin/swaync` yields swaync-control-center and
# swaync-notification-window; waybar and rofi use their own names.
#
# If a surface here is NOT blurred at runtime, the namespace is wrong rather
# than the blur being broken -- check what the client actually calls itself
# before touching the blur_* values above.

# --- noctalia's surfaces ----------------------------------------------------
#
# ONE THING TO KNOW BEFORE TOUCHING ANY OF THIS: noctalia cannot blur itself.
# It asks for ext_background_effect_manager_v1, the protocol a client uses to
# have the compositor blur behind its own surface, and SwayFX 0.5.2 does not
# advertise it -- checked with `wayland-info` against this running session, where
# it is one of exactly two protocols noctalia wants and does not get (the other
# is ext_workspace_manager_v1, which is why it drives workspaces over i3 IPC).
#
# So these lines are the ONLY blur the shell gets, and they are keyed on a
# literal layer-shell namespace. The namespaces below were read out of
# /usr/bin/noctalia rather than guessed, and 18-noctalia-shell.sh asserts each
# one is still in the binary at build time -- because an upstream rename does not
# error, it silently stops blurring one surface.

# The bar. corner_radius 0 because it spans the full width at the top edge, so
# rounding would notch its top two corners against the screen edge -- and
# blur_ignore_transparent is left off for the same reason it was for waybar: the
# surface IS the bar, painted edge to edge, so there is no transparent region to
# skip and nothing to gain.
#
# The suffix is the bar's name from dotfiles/noctalia/30-bar.toml. One bar named
# `default` gives one namespace; a second bar would need a second line.
layer_effects "noctalia-bar-default" blur enable; corner_radius 0

# --- blur_ignore_transparent, and why every panel below has it ---------------
#
# A layer surface is usually much bigger than what it draws. rofi -- like
# swaync before it stopped being blurred at all -- took a surface the size of
# the whole output and painted its window somewhere inside it, leaving the rest
# fully transparent. Blur applies to what is behind THE SURFACE, not behind the
# pixels, so `blur enable` on such a surface frosts the entire screen for as
# long as it is mapped. That is not a subtlety: measured with swaync's panel
# open and this option off, a window region on the far side of the screen scored
# 50.7 on a Laplacian sharpness metric against 233.8 with it on, and the bar's
# own glyphs smeared into blobs.
#
# `blur_ignore_transparent enable` limits the blur to the parts of the surface
# that are actually painted -- fully transparent regions only; anything at an
# alpha between 0 and 1 is still frosted.
#
# Every noctalia panel is that shape, so every one of them gets it.

# The panels: control centre, launcher, clipboard, session menu, polkit prompt.
# `noctalia-panel` is the floating kind, `noctalia-attached-panel` the kind
# anchored under the bar widget that opened it -- 10-shell.toml decides which
# surface each panel uses, so both need the line.
#
# corner_radius 9 is the desktop's single radius from the top of this file, and
# the panels carry a #2e2e2e hairline ([shell] popup_borders), so the rounding
# here has to match it or the border corners square off around a rounded fill --
# the same constraint rofi's 1px border imposed. These four lines and
# `corner_radius` above are one number in five places: change it in one and the
# panels stop agreeing with the windows.
layer_effects "noctalia-panel"          blur enable; blur_ignore_transparent enable; corner_radius 9
layer_effects "noctalia-attached-panel" blur enable; blur_ignore_transparent enable; corner_radius 9

# The OSD and the notifications. Both are small surfaces inside a big one, both
# draw at 0.72 alpha, and the OSD is the surface this desktop never had -- volume
# and brightness used to arrive as a swaync notification with an int:value hint.
layer_effects "noctalia-osd"          blur enable; blur_ignore_transparent enable; corner_radius 9
layer_effects "noctalia-notification" blur enable; blur_ignore_transparent enable; corner_radius 9

# --- The namespaces deliberately left out, and why --------------------------
#
# This is the swaync lesson, kept because it cost a measurement to learn and
# applies to four more surfaces now than it did to two.
#
# noctalia-backdrop, noctalia-click-shield, noctalia-panel-click-shield and
# noctalia-screen-corner are all full-output surfaces, and two of them are
# input-only. On a surface that size:
#
#   corner_radius rounds the SURFACE, so it rounds the SCREEN's corners, not the
#   panel's. The panel's own corners come from noctalia's own radii.
#
#   shadows draws around the surface too, so it draws a shadow nobody can see.
#
#   blur without blur_ignore_transparent frosts everything, as measured above --
#   and WITH it, on a surface that paints nothing, it computes a full-screen blur
#   pass to show nothing at all.
#
# noctalia-lockscreen-widgets-editor and noctalia-desktop-widgets-editor are left
# out because they are transient editing surfaces, and noctalia-screenshot-region
# because frosting the region selector would blur the thing being selected.
#
# The lock screen is not here either: [lockscreen] blurred_desktop = true makes
# noctalia blur its own snapshot of the desktop, which is a different mechanism
# and one it can actually do -- it is compositing an image it already holds
# rather than asking the compositor about what is behind it.
