# A later `bindsym` wins, so this file overrides /etc/sway/config without
# editing it.
#
# BUT NOT /usr/share/sway/config.d/. layered-include emits its includes in
# BASENAME SORT ORDER, so the 60-bindings-* drop-ins are read AFTER this file
# and win. Rebinding the media, volume, brightness or Print keys from here does
# NOT work -- the drop-ins have to be retired, and are, in
# system_files/etc/sway/config.d/.
#
# `--no-warn` where a binding is overwritten on purpose: without it sway raises
# "There are errors in your config file", which puts a swaynag bar on screen,
# which is what verify.sh checks for the absence of.
#
# Already bound upstream: $mod+Return, $mod+d, $mod+Shift+{q,c,e}, $mod+r,
# $mod+{a,b,e,f,s,v,w}, $mod+minus, $mod+Shift+minus, $mod+Pause, and
# $mod+{1..0} / $mod+Shift+{1..0}, which the block below takes over.
# Free: $mod+{g,i,m,o,p,q,t,u,x,y,z}.

# PER-SCREEN WORKSPACES. $mod+1..0 is "this screen's 1..10": every screen owns a
# private block of ten, worked out from `swaymsg -t get_outputs` on each press,
# so a number key never moves focus to the other monitor. Shift moves the window
# AND follows it, which the stock binding does not do.
#
# The digit is no longer the workspace number -- the leftmost screen's 1..10 are
# workspaces 1-10, the next screen's are 11-20 -- which is invisible because the
# bar draws dots rather than numbers (noctalia/30-bar.toml, show_labels).
# 10-outputs.conf pins no workspace to any monitor any more; see it for why the
# reconcile there is still needed.
#
# --no-warn on all twenty because all twenty overwrite /etc/sway/config:122-142.
# That is what the flag is for, per the header above -- without it sway raises
# the error bar twenty times over.
#
# --no-repeat because, unlike the stock binding, these fork a process. Held
# down, an autorepeating key would spawn dozens a second all computing the same
# answer.
#
# A binding here that seems to do nothing is almost always workspace-block.sh
# not being executable: sway's `exec` runs it through sh, which fails with one
# line in the log and NOTHING on screen. verify.sh checks the mode for that
# reason.
bindsym --no-warn --no-repeat $mod+1 exec $HOME/.config/sway/workspace-block.sh switch 1
bindsym --no-warn --no-repeat $mod+2 exec $HOME/.config/sway/workspace-block.sh switch 2
bindsym --no-warn --no-repeat $mod+3 exec $HOME/.config/sway/workspace-block.sh switch 3
bindsym --no-warn --no-repeat $mod+4 exec $HOME/.config/sway/workspace-block.sh switch 4
bindsym --no-warn --no-repeat $mod+5 exec $HOME/.config/sway/workspace-block.sh switch 5
bindsym --no-warn --no-repeat $mod+6 exec $HOME/.config/sway/workspace-block.sh switch 6
bindsym --no-warn --no-repeat $mod+7 exec $HOME/.config/sway/workspace-block.sh switch 7
bindsym --no-warn --no-repeat $mod+8 exec $HOME/.config/sway/workspace-block.sh switch 8
bindsym --no-warn --no-repeat $mod+9 exec $HOME/.config/sway/workspace-block.sh switch 9
bindsym --no-warn --no-repeat $mod+0 exec $HOME/.config/sway/workspace-block.sh switch 10

bindsym --no-warn --no-repeat $mod+Shift+1 exec $HOME/.config/sway/workspace-block.sh move 1
bindsym --no-warn --no-repeat $mod+Shift+2 exec $HOME/.config/sway/workspace-block.sh move 2
bindsym --no-warn --no-repeat $mod+Shift+3 exec $HOME/.config/sway/workspace-block.sh move 3
bindsym --no-warn --no-repeat $mod+Shift+4 exec $HOME/.config/sway/workspace-block.sh move 4
bindsym --no-warn --no-repeat $mod+Shift+5 exec $HOME/.config/sway/workspace-block.sh move 5
bindsym --no-warn --no-repeat $mod+Shift+6 exec $HOME/.config/sway/workspace-block.sh move 6
bindsym --no-warn --no-repeat $mod+Shift+7 exec $HOME/.config/sway/workspace-block.sh move 7
bindsym --no-warn --no-repeat $mod+Shift+8 exec $HOME/.config/sway/workspace-block.sh move 8
bindsym --no-warn --no-repeat $mod+Shift+9 exec $HOME/.config/sway/workspace-block.sh move 9
bindsym --no-warn --no-repeat $mod+Shift+0 exec $HOME/.config/sway/workspace-block.sh move 10

bindsym $mod+Shift+Escape exec noctalia msg session lock
bindsym --no-warn $mod+Shift+e exec noctalia msg panel-toggle session
bindsym --no-warn $mod+d exec noctalia msg panel-toggle launcher

bindsym $mod+n       exec noctalia msg panel-toggle control-center
bindsym $mod+Shift+n exec noctalia msg notification-dnd-toggle
bindsym $mod+c       exec noctalia msg panel-toggle clipboard
bindsym $mod+Shift+w exec noctalia msg panel-open control-center

# Region capture goes straight to zwlr_screencopy_manager_v1:
# xdg-desktop-portal-wlr is whole-output only, so a portal-based region grab
# would silently be a full-screen one.
bindsym Print       exec noctalia msg screenshot-region
bindsym Shift+Print exec noctalia msg screenshot-fullscreen

# --locked so these still work with the lock screen up.
bindsym --locked XF86AudioRaiseVolume exec noctalia msg volume-up
bindsym --locked XF86AudioLowerVolume exec noctalia msg volume-down
bindsym --locked XF86AudioMute        exec noctalia msg volume-mute
bindsym --locked XF86AudioMicMute     exec noctalia msg mic-mute

# Both outputs are external, so /sys/class/backlight is empty and brightnessctl
# never did anything here. noctalia goes over DDC/CI instead, which is what
# [brightness] enable_ddcutil is for.
bindsym --locked XF86MonBrightnessUp   exec noctalia msg brightness-up
bindsym --locked XF86MonBrightnessDown exec noctalia msg brightness-down

bindsym --locked XF86AudioPlay exec noctalia msg media play-pause
bindsym --locked XF86AudioNext exec noctalia msg media next
bindsym --locked XF86AudioPrev exec noctalia msg media previous
bindsym --locked XF86AudioStop exec noctalia msg media stop
