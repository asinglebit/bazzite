# Bindings this desktop adds, and the ones it takes back from Fedora's defaults.
#
# The layered include reads this directory last and a later `bindsym` wins, so
# everything here overrides /etc/sway/config without that file needing to change.
#
# BUT NOT /usr/share/sway/config.d/, AND THIS IS THE TRAP THIS FILE USED TO FALL
# INTO. layered-include emits its includes in BASENAME SORT ORDER, so this file
# is read at position 6 of 19 and 60-bindings-{volume,brightness,media,
# screenshot}.conf are read at 10 through 13 -- after it. Their bindings
# therefore win over anything set here. Rebinding the media, volume, brightness
# and Print keys from this file does NOT work; the four package drop-ins have to
# be retired, and they are, in system_files/etc/sway/config.d/. Read the note in
# any one of them before adding a key that Fedora already binds.
#
# What was already bound before this file: $mod+Return (terminal), $mod+d
# (launcher), $mod+Shift+q (kill), $mod+Shift+c (reload), $mod+Shift+e (the
# stock swaynag exit prompt), $mod+r (resize mode), $mod+{a,b,e,f,s,v,w}
# (layout), $mod+minus / $mod+Shift+minus (scratchpad), $mod+Pause (passthrough).
#
# Free after this file: $mod+{g,i,m,o,p,q,t,u,x,y,z}.

# --- Session -----------------------------------------------------------------

# Lock.
#
# `noctalia msg session lock` rather than `loginctl lock-session`. The old
# binding went through logind so that the manual lock, the idle timeout and
# before-sleep all took one path through hypridle's `lock_cmd` and its
# `pidof hyprlock` guard -- three mechanisms that had to be made to agree.
#
# There is one mechanism now. The lock screen and the idle daemon are the same
# process, so the guard, the path and the agreement are all internal. logind
# still works and still locks -- noctalia honours the Lock signal, which is what
# `[lockscreen] lock_before_suspend` rides on -- but naming the shell directly
# is one less indirection to reason about when it does not happen.
bindsym $mod+Shift+Escape exec noctalia msg session lock

# The session menu, which was wlogout.
#
# --no-warn because this overwrites /etc/sway/config's swaynag exit prompt, and
# an overwritten binding makes sway raise "There are errors in your config file"
# on every reload -- which puts a swaynag bar on screen, which is the thing
# verify.sh checks for the absence of.
#
# The five entries wlogout/layout carried -- lock, logout, suspend, reboot,
# shutdown -- are [shell.session.actions] now, and there is a sixth:
# lock_and_suspend, which the old menu could not express without a shell script.
bindsym --no-warn $mod+Shift+e exec noctalia msg panel-toggle session

# The launcher, which was rofi.
#
# /etc/sway/config:80 binds $mod+d to $menu, and $menu is still the dead rofi
# command line -- sway expands `set` at parse time, so a drop-in cannot change
# it, only rebind the key over the top. That is what this does. 10-sway-install.sh
# explains why the $term rewrite has to be a sed at the source while this does
# not need to be.
#
# Window switching comes free: it was the one thing /etc/sway/config's own TODO
# was waiting on rofi for. `/windows` in the launcher, or /calc, /emoji,
# /session, /wallpaper.
bindsym --no-warn $mod+d exec noctalia msg panel-toggle launcher

# --- Notifications and the control centre ------------------------------------
#
# One panel holds the notification list, the quick toggles, the volume and
# brightness sliders, the media player and the calendar -- swaync's control
# centre and waybar's clock tooltip in one surface. The bar's status pill opens
# the same thing on left-click.
bindsym $mod+n       exec noctalia msg panel-toggle control-center
bindsym $mod+Shift+n exec noctalia msg notification-dnd-toggle

# The clipboard history, which was cliphist behind rofi-clipboard.sh.
#
# THE DAEMON HALF IS GONE, and that is the point. There used to be an
# `exec_always pkill -x wl-paste; wl-paste --watch cliphist store` line here to
# keep a watcher running, with the pkill because exec_always would otherwise
# leave a second watcher behind on every reload, each storing its own copy of
# every clip. It was also subtly broken: the line is unquoted, so sway split it
# on the `;` and handed the second half to itself as a command, which failed.
# noctalia watches the selection from inside the shell process; there is no
# watcher to start, restart or double up.
bindsym $mod+c exec noctalia msg panel-toggle clipboard

# The network picker, which was rofi-wifi.sh.
#
# That script existed because swaync's toggle could only turn the radio on and
# off -- picking a network needed nmcli, a dmenu and a password prompt, and the
# password only worked because nmcli registers its own secret agent for the
# duration of one call. noctalia is a NetworkManager SecretAgent proper, so the
# panel can join a network, and 802.1X and per-session VPN secrets -- which the
# old arrangement could not do at all -- work for the first time.
bindsym $mod+Shift+w exec noctalia msg panel-open control-center

# --- Screenshots -------------------------------------------------------------
#
# Fedora's 60-bindings-screenshot.conf is retired in the image, so these are the
# only bindings on these keys rather than overrides of grimshot's.
#
# grim, slurp and grimshot are all still installed -- hard deps of
# sway-config-fedora, they cannot leave -- and nothing calls them. noctalia goes
# to zwlr_screencopy_manager_v1 directly, which matters for region capture:
# xdg-desktop-portal-wlr is whole-output only, so a portal-based region grab
# would silently be a full-screen one.
#
# WHAT WENT WITH swappy: annotation, and screen recording, which this image
# never had. There is no recorder now and no plan for one.
bindsym Print       exec noctalia msg screenshot-region
bindsym Shift+Print exec noctalia msg screenshot-fullscreen

# --- Media, volume and brightness --------------------------------------------
#
# All four Fedora drop-ins that used to own these keys are retired in the image;
# see the ordering note at the top of this file for why they had to be, rather
# than simply rebound here.
#
# What is gained is the OSD. The old bindings faked one: brightnessctl and pactl
# sent a notification carrying an `int:value` hint for swaync to draw as a
# progress bar, which is why /usr/share/sway/config.d/60-bindings-brightness.conf
# has a $brightness_notification_cmd in it. These are a real on-screen display,
# configured in dotfiles/noctalia/10-shell.toml.
#
# --locked so they still work with the lock screen up, as Fedora's did.
bindsym --locked XF86AudioRaiseVolume exec noctalia msg volume-up
bindsym --locked XF86AudioLowerVolume exec noctalia msg volume-down
bindsym --locked XF86AudioMute        exec noctalia msg volume-mute
bindsym --locked XF86AudioMicMute     exec noctalia msg mic-mute

# brightnessctl read /sys/class/backlight, which is EMPTY on this machine -- both
# outputs are external, so these keys have never done anything. noctalia goes
# over DDC/CI with ddcutil instead, which is why [brightness] enable_ddcutil is
# on. First time these keys have worked here.
bindsym --locked XF86MonBrightnessUp   exec noctalia msg brightness-up
bindsym --locked XF86MonBrightnessDown exec noctalia msg brightness-down

bindsym --locked XF86AudioPlay exec noctalia msg media play-pause
bindsym --locked XF86AudioNext exec noctalia msg media next
bindsym --locked XF86AudioPrev exec noctalia msg media previous
bindsym --locked XF86AudioStop exec noctalia msg media stop
