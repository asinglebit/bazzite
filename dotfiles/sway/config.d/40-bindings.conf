# Bindings this desktop adds, and the ones it takes back from Fedora's
# defaults.
#
# The layered include reads this directory last, and a later `bindsym` wins, so
# everything here overrides /etc/sway/config and /usr/share/sway/config.d/
# without those files needing to change. That is why the screenshot bindings
# below can sit next to the new ones rather than in a same-named override of
# 60-bindings-screenshot.conf.
#
# What was already bound before this file: $mod+Return (terminal), $mod+d
# (launcher), $mod+Shift+q (kill), $mod+Shift+c (reload), $mod+Shift+e (the
# stock swaynag exit prompt), $mod+r (resize mode), $mod+{a,b,e,f,s,v,w}
# (layout), $mod+minus / $mod+Shift+minus (scratchpad), $mod+Pause
# (passthrough), Print / Alt+Print / Ctrl+Print (screenshots to file).
#
# Free after this file: $mod+{g,i,m,o,p,q,t,u,x,y,z}.

# --- Session -----------------------------------------------------------------

# Lock. There was NO manual lock binding at all before this -- only swayidle's
# 300s timeout and `loginctl lock-session` typed by hand. The binding Fedora's
# 90-swayidle.conf suggests in a comment, and never actually sets.
#
# `loginctl lock-session` rather than calling hyprlock directly, so that this
# binding, the idle timeout and before-sleep all take the same path through
# hypridle's lock_cmd -- which is also what makes the `pidof hyprlock` guard
# there effective. Calling hyprlock straight from here would bypass it and
# could stack a second instance on top of an already-locked screen.
bindsym $mod+Shift+Escape exec loginctl lock-session

# The power menu. Replaces the stock $mod+Shift+e, which is a swaynag bar --
# unthemed (swaynag has its own colour set and no config file anywhere) and
# offering only "exit sway".
#
# wlogout was already installed by 10-sway-install.sh and, until now, bound to
# nothing at all.
#
# `--no-warn` because this is the one line in this file that OVERWRITES an
# existing binding rather than adding a new one, and sway reports an overwritten
# binding as a config warning -- which raises the very same "There are errors in
# your config file" swaynag bar that a syntax error would, at every startup and
# every reload. This line was the only thing in that bar. The flag is sway(5)'s
# documented way to say the override is deliberate; it changes nothing about what
# the key does.
bindsym --no-warn $mod+Shift+e exec wlogout --protocol layer-shell

# --- Notifications -----------------------------------------------------------
#
# swaync's control centre: the volume slider, the media player, do-not-disturb
# and the quick toggles. -sw makes the client wait for the daemon to be up
# rather than failing if it is asked too early in the session.
bindsym $mod+n       exec swaync-client -t -sw
bindsym $mod+Shift+n exec swaync-client -d -sw

# --- Clipboard and network, through the launcher -----------------------------
#
# Both scripts pipe into `rofi -dmenu`, which reads ~/.config/rofi/config.rasi
# like any other rofi invocation -- so they inherit the launcher's theme and
# there is no second UI to keep in sync.
bindsym $mod+c       exec $HOME/.config/sway/rofi-clipboard.sh
bindsym $mod+Shift+w exec $HOME/.config/sway/rofi-wifi.sh

# The clipboard history daemon. `exec_always` so it comes back after a
# `swaymsg reload`; cliphist itself is a one-shot store per paste, and
# `wl-paste --watch` is the long-running half.
#
# pkill first: exec_always would otherwise leave a second wl-paste watcher
# behind on every reload, and each one stores its own copy of every clip.
exec_always pkill -x wl-paste; wl-paste --watch cliphist store

# --- Screenshots -------------------------------------------------------------
#
# Fedora's 60-bindings-screenshot.conf binds Print / Alt+Print / Ctrl+Print to
# `grimshot save ...`, which writes a file and gives no feedback at all. Those
# three still work; these add the two things actually wanted day to day.
#
# To the clipboard, no file on disk:
bindsym Shift+Print exec grimshot copy area
bindsym $mod+Print  exec grimshot copy output

# Annotate before sharing. swappy is GTK3, so it picks up adw-gtk3-dark and
# Papirus-Dark like the rest of the GTK apps. `-f -` reads the PNG on stdin,
# which is what `grimshot save area -` writes.
bindsym $mod+Shift+Print exec grimshot save area - | swappy -f -
