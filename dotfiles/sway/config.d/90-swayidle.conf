# Deliberately empty. This is not a stub to be filled in.
#
# The layered include loads $XDG_CONFIG_HOME/sway/config.d/ last and a
# same-named file REPLACES the one from /usr/share, so a zero-byte file here
# retires /usr/share/sway/config.d/90-swayidle.conf entirely. Fedora's own
# config documents this as the supported way to disable one of its drop-ins:
#
#     $ echo -n > "$HOME/.config/sway/config.d/90-bar.conf"
#
# What it retired: `swayidle -w` driving swaylock, with four swaylock-specific
# hooks (`swaylock -f`, `pgrep -x swaylock`, `pkill -SIGUSR1 swaylock`).
#
# Why it had to go rather than be edited: hyprlock has no daemonize flag, and
# `swayidle -w` blocks until each command returns. `swaylock -f` forks once the
# screen is locked, so "the command exited" means "the screen is locked";
# hyprlock does not exit until you authenticate. Point swayidle at hyprlock and
# it blocks for the whole duration of the lock -- the 360s display-off timeout
# and its resume handler never fire, and the monitors stay on all night.
#
# What replaced it: hypridle, as a systemd user unit wanted by
# sway-session.target (wired in build_files/16-hyprlock.sh, configured in
# ~/.config/hypr/hypridle.conf). Nothing is started from sway's config, which is
# why there is nothing to put in this file.
#
# swayidle and swaylock both stay INSTALLED, unbound -- the foot precedent. To
# fall back to them, delete this file and log out; Fedora's drop-in loads again.
