# Outputs are matched by EDID identifier, not connector name: connectors move
# between ports and re-enumerate, the identifier does not.
#
# Dell 3840x2160 ~163 PPI, HP 1920x1080 ~82 PPI, both 27". Exactly 2x the
# density, so scale 2 makes a window the same physical size on either screen.
# Integer scaling also keeps Xwayland clients sharp; 1.5 would not.
set $mon_main "Dell Inc. DELL U2718Q FN84K78S04DL"
set $mon_left "Hewlett Packard HP 27xi 3CM34900KZ"

output $mon_left mode 1920x1080@60Hz position 0 0    scale 1
output $mon_main mode 3840x2160@60Hz position 1920 0 scale 2

# Second output on each line is a fallback for when the first is disconnected.
workspace 1  output $mon_main $mon_left
workspace 2  output $mon_main $mon_left
workspace 3  output $mon_main $mon_left
workspace 4  output $mon_main $mon_left
workspace 5  output $mon_main $mon_left
workspace 6  output $mon_left $mon_main
workspace 7  output $mon_left $mon_main
workspace 8  output $mon_left $mon_main
workspace 9  output $mon_left $mon_main
workspace 10 output $mon_left $mon_main

# The pins above only apply when a workspace is CREATED. At startup sway makes
# one workspace per output using the next free number, so the HP came up as 2
# and stayed on the wrong monitor. Seeding 6 claims the HP first; `workspace 1`
# then lands focus on the Dell.
#
# `exec`, not `exec_always` -- re-running this on reload would yank focus.
exec swaymsg 'workspace 6; workspace 1'

exec_always $HOME/.config/sway/xwayland-primary.sh
