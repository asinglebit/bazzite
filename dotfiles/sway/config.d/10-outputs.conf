# Monitor layout for this machine.
#
# Outputs are matched by EDID identifier ("make model serial") rather than by
# connector name (HDMI-A-1 / HDMI-A-2), so the layout survives being replugged
# into different ports or the driver enumerating the connectors in a different
# order -- which is what makes "the ordering is wrong" come back otherwise.
#
#   Dell U2718Q  27"  3840x2160  ~163 PPI   currently HDMI-A-2   main, right
#   HP 27xi      27"  1920x1080   ~82 PPI   currently HDMI-A-1   left
#
# Both panels are physically 27", and the Dell has almost exactly twice the
# pixel density (163/82), so scale 2 is the exact match: a window is the same
# physical size on either screen. Integer scaling also keeps Xwayland clients
# (Steam, Proton titles) sharp -- a fractional scale such as 1.5 would not.
#
# Resulting logical layout. At scale 2 the Dell is 1920x1080 logical, the same
# height as the HP, so neither needs a vertical offset:
#
#     x=0             x=1920          x=3840
#     +---------------+---------------+
#     |   HP 27xi     |  Dell U2718Q  |
#     |   1920x1080   |   1920x1080   |   <- logical (3840x2160 at scale 2)
#     +---------------+---------------+
#            y=0             y=0

set $mon_main "Dell Inc. DELL U2718Q FN84K78S04DL"
set $mon_left "Hewlett Packard HP 27xi 3CM34900KZ"

output $mon_left mode 1920x1080@60Hz position 0 0    scale 1
output $mon_main mode 3840x2160@60Hz position 1920 0 scale 2

# Main display. Workspaces 1-5 are pinned to the Dell, 6-10 to the HP. The
# second output on each line is a fallback: if that monitor is disconnected the
# workspace lands on the other one instead of disappearing.
workspace 1  output $mon_main $mon_left
workspace 2  output $mon_main $mon_left
workspace 3  output $mon_main $mon_left
workspace 4  output $mon_main $mon_left
workspace 5  output $mon_main $mon_left
workspace 6  output $mon_left $mon_main
workspace 7  output $mon_left $mon_main
workspace 8  output $mon_left $mon_main
workspace 9  output $mon_left $mon_main
workspace 10 output $mon_left $mon_main

# Start the session focused on the main display.
focus output $mon_main

# The pins above only govern where a workspace lands when it is CREATED --
# sway(5): "This command does not affect existing workspaces." At startup sway
# makes one workspace per output and names it with the next free number, so
# the HP came up as workspace 2 rather than 6 and sat permanently on the wrong
# monitor. Seeding 6 explicitly claims the HP before sway can invent a low
# number for it; the trailing `workspace 1` hands focus back to the Dell,
# which is what the line above wants anyway.
#
# `exec`, not `exec_always`: this is a startup-naming problem, and re-running
# it on every `swaymsg reload` would yank focus mid-edit.
exec swaymsg 'workspace 6; workspace 1'

# Sway does not set an Xwayland RandR primary output, and X11 game launchers
# care about it. See the script's header comment.
exec_always $HOME/.config/sway/xwayland-primary.sh
