# Monitors are named by EDID identifier because connector names change when you swap ports.
# The Dell has exactly twice the pixel density of the others, so scale 2 makes a window the same real size everywhere.
set $mon_main  "Dell Inc. DELL U2718Q FN84K78S04DL"
set $mon_left  "Hewlett Packard HP 27xi 3CM34900KZ"
set $mon_right "ASUSTek COMPUTER INC VG279QE5A W5LMTF138351"

# No @Hz, so sway picks the highest refresh rate each connection offers.
output $mon_left  mode 1920x1080 position 0 0    scale 1
output $mon_main  mode 3840x2160 position 1920 0 scale 2
output $mon_right mode 1920x1080 position 3840 0 scale 1

# No `workspace N output` pins on purpose: each screen owns its own ten, worked out at runtime.

# Puts every screen on one of its own workspaces, at startup and again on reload if any drifted.
# Only the first run of a session ends on $mon_main, so the session still starts on the Dell.
exec_always $HOME/.config/sway/workspace-block.sh reconcile $mon_main

exec_always $HOME/.config/sway/xwayland-primary.sh
