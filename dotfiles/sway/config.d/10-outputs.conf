# Outputs are matched by EDID identifier, not connector name: connectors move
# between ports and re-enumerate, the identifier does not.
#
# Dell 3840x2160 ~163 PPI, HP 1920x1080 ~82 PPI, both 27". Exactly 2x the
# density, so scale 2 makes a window the same physical size on either screen.
# Integer scaling also keeps Xwayland clients sharp; 1.5 would not.
set $mon_main "Dell Inc. DELL U2718Q FN84K78S04DL"
set $mon_left "Hewlett Packard HP 27xi 3CM34900KZ"

output $mon_left mode 1920x1080@60Hz position 0 0    scale 1
output $mon_main mode 3840x2160@60Hz position 1920 0 scale 2

# NO `workspace <n> output ...` PINS, DELIBERATELY -- DO NOT ADD ONE BACK.
# Workspaces used to be split 1-5 here and 6-10 there, which cost each screen
# half the number row. Now every screen owns a private block of ten, worked out
# from the `position` numbers above -- leftmost screen first -- read back over
# IPC when a key is pressed. 40-bindings.conf and sway/workspace-block.sh.
#
# A pin would silently outrank that: sway consults the pins FIRST when it
# creates a workspace and only then falls back to the focused screen, so one
# surviving line would nail one number to one monitor while its nine neighbours
# followed focus. verify.sh fails if one reappears.

# Puts every screen on a workspace from its own block, drags home any that
# drifted, and hands focus back. Replaces `swaymsg 'workspace 6; workspace 1'`.
#
# Still needed, for a new reason. Sway names the workspace it auto-creates on a
# screen after the lowest free NUMBER unless a pin or a literal `workspace <n>`
# KEYBINDING has claimed one. Both are gone -- the bindings are `exec` now,
# which that scan cannot read -- so without this the second screen comes up
# owning "2", a number from the first screen's block.
#
# `exec_always`, unlike the line it replaces, because this is a reconcile and
# not a seed: it leaves a screen alone when the workspace on it already belongs
# to it, and it finishes where focus already was, so a reload is a no-op in
# steady state and a repair otherwise. That is what makes `just link-dotfiles &&
# swaymsg reload` migrate the old layout, and what fixes a hotplug without a
# daemon watching for one. Only on the session's FIRST run does it finish
# somewhere of its own choosing -- $mon_main, so the session still starts on the
# Dell, which is the job the old `workspace 6; workspace 1` line was doing.
exec_always $HOME/.config/sway/workspace-block.sh reconcile $mon_main

exec_always $HOME/.config/sway/xwayland-primary.sh
