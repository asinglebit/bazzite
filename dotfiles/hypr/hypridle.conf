# Idle management: hypridle, which replaced swayidle.
#
# Started as a systemd user unit wanted by sway-session.target, not from sway's
# config -- see build_files/16-hyprlock.sh for why, and
# ~/.config/sway/config.d/90-swayidle.conf (empty, on purpose) for what it
# replaced.
#
# The image ships a fallback at /etc/xdg/hypr/hypridle.conf, last in hypridle's
# search order, so this file shadows it. It exists because hypridle has no
# built-in defaults and the unit carries Restart=on-failure: five failures in
# ten seconds wedge it for the rest of the session, so a login before
# `just link-dotfiles` used to leave nothing that locks or blanks, silently.
# KEEP THE TIMINGS AT THE BOTTOM OF THIS FILE IN STEP WITH THAT ONE.
#
# hyprlang syntax. TWO THINGS TO KNOW BEFORE EDITING:
#
#  1. hyprlang ERRORS ON UNKNOWN KEYS. A typo'd option name does not get
#     ignored -- hypridle refuses to start, and the symptom is silence: no
#     auto-lock and no display blanking, discovered five minutes after you walk
#     away from the machine. There is no build-time check for this file
#     (hypridle connects to Wayland in its constructor, before it parses
#     anything, so it cannot be validated in a container), so after any edit:
#
#         systemctl --user restart hypridle && systemctl --user status hypridle
#
#  2. Environment variables are substituted from the real environment, and they
#     take PRECEDENCE over variables declared in the file. Do not name a
#     `$variable` here after anything in env(1).
#
# Timings are the ones Fedora's drop-in used ($lock_timeout 300, then
# $screen_timeout 60 more), kept so the swap is not also a behaviour change.

general {
    # Everything locks through logind rather than by running hyprlock directly:
    # the $mod+Shift+Escape binding in sway, the idle timeout below, and
    # before_sleep_cmd all issue `loginctl lock-session`, which hypridle catches
    # as a D-Bus lock event and answers with this one command. One path, so the
    # pidof guard below is actually effective.
    #
    # `pidof hyprlock ||` is that guard: without it a second lock event on an
    # already-locked screen stacks a second hyprlock on top of the first, and
    # you get to authenticate twice.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before suspending. This is the case that motivated hypridle over a
    # patched swayidle line: hypridle holds a logind delay inhibitor while the
    # lock comes up (see inhibit_sleep), so the machine cannot sleep with the
    # screen still showing. Backgrounding a locker from swayidle cannot make
    # that guarantee.
    before_sleep_cmd = loginctl lock-session

    # On resume the outputs come back. swayidle's `resume` hooks are gone with
    # its config, and DPMS state does not reliably survive a suspend cycle.
    after_sleep_cmd = swaymsg "output * power on"

    # 1 = a normal logind delay inhibitor. NOT the default 2 ("auto").
    #
    # Mode 2 uses hyprland-lock-notify-v1 when the compositor offers it and
    # falls back to exactly this otherwise -- and sway does not offer it, so on
    # this machine 2 and 1 are the same thing. Naming it means the behaviour
    # cannot change under us if that protocol ever appears, and it documents
    # which mechanism is actually in play.
    #
    # Mode 3 would REQUIRE that protocol and is therefore unusable here.
    inhibit_sleep = 1

    # NOT SET, deliberately: on_lock_cmd and on_unlock_cmd. Both need
    # hyprland-lock-notify-v1 to detect that a locker took the session, which
    # sway does not implement -- hypridle logs a warning about exactly these two
    # keys plus inhibit_sleep=3 at startup. lock_cmd/unlock_cmd above are the
    # D-Bus-driven equivalents and do work.
}

# Lock after five minutes idle.
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}

# Blank the outputs a minute after that. Separate listener rather than a longer
# timeout on the one above, because DPMS has to be able to resume on input
# while the lock stays up.
listener {
    timeout    = 360
    on-timeout = swaymsg "output * power off"
    on-resume  = swaymsg "output * power on"
}
