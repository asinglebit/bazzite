# The lock screen.
#
# Replaces swaylock, which is kept installed as the fallback and still themed in
# ~/.config/swaylock/config. The reason for the swap is narrow: swaylock cannot
# blur, and once the bar, the launcher and the notification centre are frosted
# (sway/config.d/25-effects.conf) the lock screen is the one surface left that
# visibly cannot match.
#
# hyprlock has no built-in defaults: it exits 1 if it finds no config in any of
# $XDG_CONFIG_HOME, $HOME, $XDG_CONFIG_DIRS, /etc/xdg. This file sits in the
# FIRST of those, so it is the one that runs -- but it is no longer the only one
# that can. The image ships a minimal fallback at /etc/xdg/hypr/hyprlock.conf
# (build_files/16-hyprlock.sh), which is the LAST entry in that order, so a
# login before `just link-dotfiles` now gets a plain lock screen rather than
# none at all. This file shadows it completely.
#
# The two differ on purpose: the fallback has no wallpaper -- it cannot depend
# on a dotfile without recreating the problem it exists to solve -- and it
# leaves `hide_input` at the default. Its own header says why.
#
# hyprlang syntax, with three traps worth knowing before editing:
#
#  1. `$HOME` works in a path here. `~` does NOT. hyprlock hands `path`
#     straight to its resource loader with no expansion; the substitution
#     happens one level down in hyprlang, which resolves $NAME against the
#     process environment. Tilde expansion is applied only to `source =`
#     includes, never to a widget path. Get this wrong and the background
#     silently falls back to a flat colour.
#  2. Environment variables take PRECEDENCE over variables declared in this
#     file, so do not name a `$variable` after anything in env(1).
#  3. hyprlang ERRORS ON UNKNOWN KEYS, and there is no validate-only mode --
#     hyprlock has no --verify flag, so this cannot be checked at build time.
#     A typo means the lock screen fails to appear. Test after any edit by
#     locking deliberately: `loginctl lock-session`.
#
# Palette, dark to light. Identical to waybar/style.css and rofi/config.rasi:
#   #1a1a1a  darkest surface        #9a9a9a  base text
#   #242424  desktop grey / fill    #d8d8d8  bright
#   #2e2e2e  hairline               #ffffff  alert
#
# Greyscale has no red, so a rejected password signals with maximum brightness
# instead -- the same decision, for the same reason, as swaylock/config.

$font_ui   = Inter
$font_mono = Hack Nerd Font Mono

general {
    # Nothing to point at on a lock screen, and hiding it means a nudged mouse
    # does not put a cursor on an otherwise still image.
    hide_cursor = true
}

# --- Background --------------------------------------------------------------
background {
    monitor =

    # The wallpaper already in this repo at dotfiles/sway/wallpaper.png, the
    # same file sway/config.d/20-appearance.conf names for `output * bg`. It
    # does NOT need to move into the image: $HOME expansion (trap 1 above)
    # means hyprlock can reach it where it is, so changing the wallpaper is
    # still a `just link-dotfiles` rather than an image rebuild, and no
    # username enters a committed file.
    path = $HOME/.config/sway/wallpaper.png

    # Matched to `blur_passes 2` in 25-effects.conf, so the lock screen and the
    # bar are frosted to the same depth rather than to two arbitrary ones.
    blur_passes = 2
    blur_size   = 6

    # The image's own field is #181818 and its content is not uniform, so
    # #9a9a9a body text over it is marginal at full brightness. 0.4 is what
    # makes the palette legible over a 3840x2160 photograph without turning
    # the background into a flat grey -- at which point there would be no
    # reason to be running hyprlock.
    brightness = 0.4

    # NOT `path = screenshot`, which is hyprlock's signature look and does work
    # on sway (it binds wlr-screencopy, the same protocol grim already uses).
    # Rejected deliberately: a blurred screenshot leaves the shapes of open
    # windows readable to anyone walking past a locked machine.
}

# --- Password entry ----------------------------------------------------------
input-field {
    monitor =

    size              = 320, 44
    outline_thickness = 1
    rounding          = 8

    inner_color = rgb(242424)
    outer_color = rgb(2e2e2e)
    font_color  = rgb(d8d8d8)

    # State by brightness, not hue: verifying goes bright, failure goes to pure
    # white. Both against the same #242424 fill.
    check_color = rgb(d8d8d8)
    fail_color  = rgb(ffffff)

    font_family = $font_mono

    # No placeholder and no check text -- an empty field on an empty desktop.
    # The failure message is worth having, because it is the one case where
    # something needs saying; $PAMFAIL is PAM's own reason string.
    placeholder_text =
    fail_text        = $PAMFAIL

    # No dots.
    #
    # This is stricter than the swaylock config it replaces, and the difference
    # is worth understanding. swaylock highlights a rotating arc segment per
    # keypress (key-hl-color / bs-hl-color in swaylock/config): feedback that
    # a key registered, without revealing how many. hyprlock has no equivalent
    # -- its choices are one dot per character, which does reveal the length,
    # or nothing at all. Nothing at all is the safer default here.
    #
    # The cost is real: with a Bluetooth keyboard that has not reconnected,
    # there is no visual difference between typing and not typing. If that
    # bites, delete this line to get dots back.
    hide_input = true

    position = 0, -40
    halign   = center
    valign   = center
}

# --- Clock -------------------------------------------------------------------
label {
    monitor     =
    text        = $TIME
    font_family = $font_ui
    font_size   = 64
    color       = rgb(9a9a9a)

    position = 0, 80
    halign   = center
    valign   = center
}

# The date, quieter, below the clock. cmd[] is hyprlock's shell-out; update:
# is in milliseconds, and 60000 is once a minute -- there is no point polling a
# date more often than that.
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B"
    font_family = $font_ui
    font_size   = 14
    color       = rgb(5a5a5a)

    position = 0, 26
    halign   = center
    valign   = center
}
