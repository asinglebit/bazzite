# Rebuild bazzite-sway against current upstream Bazzite, publish to GHCR, sign
# with cosign.
#
# The image this produces is the one `just update` pulls. There is one of it,
# tagged :sway -- Plasma is always removed, and the login screen is
# noctalia-greeter rather than a session picker with two desktops in it.
#
# There is deliberately no :latest. Deployments track the :sway ref, so a bare
# `bootc switch ghcr.io/<owner>/bazzite-sway` resolving to some other tag would
# be a silent change of what the machine follows. Without the tag the pull fails
# and you are told to name what you meant.
name: Build and publish

on:
  # Upstream Bazzite rebuilds daily. This is what makes the image track it
  # without anyone remembering to run `just build`.
  schedule:
    - cron: '0 12 * * *'
  push:
    branches: [main]
    # None of these can change the image, so they should not spend a build.
    paths-ignore:
      - '**.md'
      - 'dotfiles/**'
      - 'verify.sh'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: bazzite-sway
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # One variant. Was a build matrix over REMOVE_KDE=0/1 and :plasma/:sway.
  IMAGE_TAG: sway

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: sway
    runs-on: ubuntu-24.04

    permissions:
      contents: read      # checkout
      packages: write     # push to ghcr.io
      # No id-token: signing is with a key, not keyless, so no OIDC is needed.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails in seconds rather than after a 40-minute build. Worse than the
      # wasted time: without this the run would build, rechunk and push
      # successfully and only fall over at the signing step, leaving an
      # UNSIGNED image on GHCR that the policy baked into it will refuse on
      # every later `bootc upgrade`.
      - name: Check the signing secret exists
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "${SIGNING_SECRET}" ]; then
            echo "::error::SIGNING_SECRET is not set. Add the contents of cosign.key as a repository secret named SIGNING_SECRET (Settings -> Secrets and variables -> Actions) before publishing."
            exit 1
          fi
          echo "SIGNING_SECRET is present"

      # The base image extracts to ~13 GB, and rpm-ostree's rechunk writes two
      # further full copies (its /var/tmp ostree repo, then the chunked output),
      # so peak demand is around 40 GB. This action takes / from ~20 GB free to
      # ~50 GB, and extra-squeeze adds ~6 GB more by also dropping
      # /opt/hostedtoolcache and miniconda. Everything stays on / -- the runner's
      # temp disk is documented at 14 GB, smaller than the base image alone.
      - name: Free up disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: 'true'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # GHCR rejects a mixed-case path; github.repository_owner is not
      # guaranteed lowercase.
      - name: Resolve registry
        id: reg
        run: echo "registry=${IMAGE_REGISTRY,,}" >> "$GITHUB_OUTPUT"

      # Same recipe you run locally. --pull=newer matters here: without it a
      # nightly rebuild could sit on a cached base and never actually pick up
      # upstream. `RUN bootc container lint` is the last layer, so it gates
      # every build including pull requests.
      - name: Build
        run: |
          just build-image \
            '${{ env.IMAGE_TAG }}' \
            '${{ steps.reg.outputs.registry }}' \
            newer

      # Re-splits the image into per-package layers that stay byte-identical
      # across rebuilds, which is what keeps a nightly `just update` in the
      # hundreds of MB rather than multiple GB. Must precede the push: it
      # rewrites the manifest, and the signature is over the pushed digest.
      - name: Rechunk
        run: just rechunk-ci '${{ env.IMAGE_TAG }}'

      - name: Disk space after rechunk
        if: always()
        run: df -h /

      # Runs after the rechunk so it also proves the rechunk preserved /etc.
      - name: Check the built image
        env:
          TAG: ${{ env.IMAGE_TAG }}
          REGISTRY: ${{ steps.reg.outputs.registry }}
        run: |
          set -euo pipefail
          sudo podman run --rm -i \
            -e "REG=${REGISTRY}" -e "NS=${REGISTRY##*/}" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${TAG}" -s <<'EOF'
          set -euo pipefail
          INFO=/usr/share/ublue-os/image-info.json

          # Identity. base-image-name must stay kinoite: it is the runtime DE
          # oracle for bazzite-user-setup and the ujust recipes.
          jq -e '."image-name"       == "bazzite-sway"' "$INFO" >/dev/null
          jq -e '."base-image-name"  == "kinoite"'      "$INFO" >/dev/null
          jq -e '."image-ref" | startswith("ostree-image-signed:docker://")' "$INFO" >/dev/null
          grep -q 'PRETTY_NAME="Bazzite Sway"' /usr/lib/os-release

          # The three trust files, without which the published image could
          # never verify its own updates.
          test -s "/etc/pki/containers/${NS}.pub"
          grep -q 'use-sigstore-attachments: true' "/etc/containers/registries.d/${NS}.yaml"
          jq -e --arg r "$REG" \
             '.transports.docker[$r][0].type == "sigstoreSigned"' \
             /etc/containers/policy.json >/dev/null
          # The catch-all has to survive, or the first bootstrap switch onto
          # this image on an untrusting machine would be impossible.
          jq -e '.transports.docker[""][0].type == "insecureAcceptAnything"' \
             /etc/containers/policy.json >/dev/null

          # Session essentials, cheap to assert and expensive to discover at boot.
          readlink -f /etc/systemd/system/display-manager.service | grep -q greetd
          test -L /usr/lib/systemd/user/sway-session.target.wants/polkit-mate-authentication-agent-1.service
          test -e /usr/share/wayland-sessions/sway.desktop

          # The terminal. ghostty comes from Terra -- as does noctalia-greeter
          # above -- so a Terra outage or a rename must fail here rather than
          # land as a desktop with no working $mod+Return. The
          # grep covers the sed in 10-sway-install.sh silently no-opping if
          # sway-config-fedora ever reformats that line.
          test -x /usr/bin/ghostty
          test -f /usr/share/terminfo/x/xterm-ghostty
          grep -q '^set \$term ghostty$' /etc/sway/config
          command -v foot >/dev/null    # retained fallback

          # Hack Nerd Font Mono is fetched from a GitHub release during the
          # build -- the one artifact here that does not come from a signed
          # repo. A 404 after an upstream retag, or a checksum bump that was
          # not applied, has to fail CI rather than ship an image whose bar and
          # terminal quietly fall back to Noto.
          test -f /usr/share/fonts/hack-nerd-fonts/HackNerdFontMono-Regular.ttf
          # -q, not `| grep -q`: grep -q exits early, fc-list takes SIGPIPE,
          # and the pipefail above turns a successful match into exit 141.
          fc-list -q 'Hack Nerd Font Mono'

          # The compositor. swayfx comes from a COPR whose RPM is a July 2025
          # .fc43 build that nobody has rebuilt since, so this is the tripwire:
          # it links libwlroots-0.19, which F44 still ships as a compat package.
          # The day that is retired, or its soname bumped, the nightly has to
          # fail HERE rather than ship an image whose desktop cannot start.
          #
          # `rpm -q --whatprovides sway`, never `rpm -q sway`: swayfx carries
          # Provides: sway = 1.11 and Conflicts: sway, so there is no package by
          # that name any more.
          rpm -q swayfx
          rpm -q --whatprovides sway >/dev/null
          test -x /usr/bin/sway
          # ldd once into a variable, then bash pattern matching -- `ldd | grep -q`
          # would let grep exit early, SIGPIPE ldd, and pipefail would turn a
          # passing assertion into exit 141.
          sway_libs="$(ldd /usr/bin/sway)"
          [[ "$sway_libs" == *libwlroots-0.19.so* ]]
          [[ "$sway_libs" == *libscenefx* ]]
          # sway-config-fedora must have survived Conflicts: sway -- it owns
          # /etc/sway/config, start-sway and the session desktop entry.
          rpm -q sway-config-fedora sway-systemd >/dev/null
          # GLES2, not vulkan: SwayFX's fx_renderer has no Vulkan path, and at
          # vulkan the compositor works but silently draws no effects.
          grep -q '^WLR_RENDERER=gles2$' /etc/sway/environment
          # And swayfx can still parse the config it inherited, after the
          # rechunk. --unsupported-gpu because sway runs its NVIDIA guard before
          # it validates; -C touches no device.
          # No `sway -C` here: it cannot run in a container at all (file
          # capability, then a libseat seat that does not exist), and a good
          # config is indistinguishable from a broken one. See the note in
          # build_files/15-swayfx.sh. verify.sh does this at runtime instead.

          # The launcher gained window switching via a second sed in
          # 10-sway-install.sh. Same failure mode as the $term one above: an
          # upstream reformat makes it a silent no-op.
          grep -q 'combi-modes drun#run#window' /etc/sway/config

          # The locker, from the third-party COPR. swaylock and swayidle are
          # asserted too because they are the documented way back if hyprlock
          # breaks, and an autoremove would take them silently.
          rpm -q hyprlock hypridle swaylock swayidle >/dev/null
          hyprlock_libs="$(ldd /usr/bin/hyprlock)"
          [[ "$hyprlock_libs" == *libEGL* || "$hyprlock_libs" == *libgbm* ]]
          test -L /usr/lib/systemd/user/sway-session.target.wants/hypridle.service

          # The notification daemon, and the symlink that makes it win the
          # org.freedesktop.Notifications race against mako.
          test -L /usr/lib/systemd/user/sway-session.target.wants/swaync.service
          test -x /usr/bin/swaync

          # The greeter. noctalia-greeter brings its own wlroots 0.20
          # compositor, so nothing hosts it and /etc carries only greetd's own
          # config -- but the wrapper and the factory copy of greeter.toml are
          # both load-bearing, and this step runs after the rechunk precisely to
          # prove they survived it. tuigreet is the retained fallback; gtkgreet
          # is gone with the sway greeter that used to host it.
          rpm -q noctalia-greeter greetd-fakegreet >/dev/null
          test -x /usr/bin/noctalia-greeter-session
          test -x /usr/bin/noctalia-greeter-compositor
          test -d /usr/share/noctalia-greeter/assets
          test -x /usr/libexec/noctalia-greeter-nvidia
          grep -q 'WLR_RENDERER:=gles2' /usr/libexec/noctalia-greeter-nvidia
          grep -q '^command = "/usr/libexec/noctalia-greeter-nvidia"$' /etc/greetd/config.toml
          # The config the greeter is copied by tmpfiles.d at boot, and the one
          # line proving it is the greyscale copy rather than something stock.
          test -s /usr/share/factory/var/lib/noctalia-greeter/greeter.toml
          grep -q '^surface *= *"#1a1a1a"$' /usr/share/factory/var/lib/noctalia-greeter/greeter.toml
          grep -q '^C+ /var/lib/noctalia-greeter/greeter.toml' /usr/lib/tmpfiles.d/bazzite-sway.conf
          # The SELinux alias, without which the state directory lands as
          # var_lib_t and xdm_t cannot write it -- a blank login screen.
          grep -q '^/var/lib/noctalia-greeter /var/lib/greetd$' \
            /etc/selinux/targeted/contexts/files/file_contexts.subs
          # wlroots 0.20 for the greeter, 0.19 for swayfx, both from Fedora.
          greeter_libs="$(ldd /usr/bin/noctalia-greeter-compositor)"
          [[ "$greeter_libs" == *libwlroots-0.20.so* ]]
          [[ "$(rpm -q --queryformat '%{VENDOR}' wlroots)" == "Fedora Project" ]]
          # The session list's only source now: no /etc/greetd/environments. Run
          # the greeter's own enumerator, which needs no display and no seat, so
          # this is behavioural rather than a grep over a desktop entry.
          grep -q '^Exec=start-sway$' /usr/share/wayland-sessions/sway.desktop
          # This runs on the FINISHED image, unlike the same call in
          # 17-noctalia-greeter.sh, so it can require that Sway is the only
          # entry: a Plasma line here means plasma.desktop outlived the KDE
          # removal and the login screen offers a session that cannot start.
          greeter_sessions="$(noctalia-greeter sessions)"
          [[ "$greeter_sessions" == *Sway* ]]
          [[ "$greeter_sessions" != *Plasma* ]]
          test ! -e /etc/greetd/environments
          command -v tuigreet >/dev/null
          ! command -v gtkgreet >/dev/null

          # Theming. papirus-folders is the SECOND artifact in this build
          # fetched from a GitHub release rather than a signed repo, so it gets
          # the same treatment as the Hack font: a 404 after an upstream retag,
          # or an unapplied checksum bump, must fail CI. The user-* symlink is
          # checked as well as folder*, because only the full variant set gives
          # Home and Desktop black icons.
          test -d /usr/share/themes/adw-gtk3-dark
          test -d /usr/share/icons/Papirus-Dark
          fc-list -q 'Inter'
          [[ "$(readlink /usr/share/icons/Papirus/48x48/places/folder.svg)"    == *folder-black* ]]
          [[ "$(readlink /usr/share/icons/Papirus/48x48/places/user-home.svg)" == *user-black*   ]]

          # The COPRs must ship DISABLED, like terra.repo. An enabled
          # third-party repo in the artifact would let a later transaction on a
          # booted machine pull from it, and bootc would 3-way merge the file.
          for f in /etc/yum.repos.d/_copr_swayfx-swayfx.repo \
                   /etc/yum.repos.d/_copr_scottames-hypr.repo; do
            test -f "$f"
            grep -q '^enabled=0$' "$f"
          done

          echo "image checks passed"
          EOF

      # Two logins, because two different users need registry credentials:
      # `sudo podman push` reads root's auth.json, cosign reads the runner
      # user's ~/.docker/config.json.
      - name: Log in to GHCR (root, for podman push)
        if: github.event_name != 'pull_request'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Log in to GHCR (runner, for cosign)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        id: push
        env:
          TAG: ${{ env.IMAGE_TAG }}
          REGISTRY: ${{ steps.reg.outputs.registry }}
        run: |
          set -euxo pipefail
          dest="${REGISTRY}/${IMAGE_NAME}"
          # One date for the whole loop, so a run straddling midnight UTC does
          # not produce two different dated tags.
          dated="${TAG}-$(date -u +%Y%m%d)"
          # Both tags are the same manifest, so they share one digest and one
          # signature covers both.
          for t in "${TAG}" "${dated}"; do
            sudo podman push --digestfile=/tmp/digestfile \
              "localhost/${IMAGE_NAME}:${TAG}" "${dest}:${t}"
          done
          {
            echo "dest=${dest}"
            echo "digest=$(sudo cat /tmp/digestfile)"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # --new-bundle-format=false --use-signing-config=false are load-bearing:
      # cosign v3 otherwise writes a bundle format that podman, skopeo and bootc
      # cannot read as a sigstore attachment, and verification then fails at
      # pull time on the machine rather than here.
      - name: Sign the image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          DEST: ${{ steps.push.outputs.dest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${DEST}@${DIGEST}"

      # Verify with the committed public key -- the same file baked into the
      # image. If SIGNING_SECRET and cosign.pub ever drift apart, this fails
      # here instead of bricking the next `just update`.
      - name: Verify the signature
        if: github.event_name != 'pull_request'
        env:
          DEST: ${{ steps.push.outputs.dest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --key cosign.pub \
            --insecure-ignore-tlog=true \
            "${DEST}@${DIGEST}"
          echo "signature verifies against the committed cosign.pub"

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DEST: ${{ steps.push.outputs.dest }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ env.IMAGE_TAG }}
        run: |
          {
            echo "### \`${TAG}\` published"
            echo
            echo '```'
            echo "${DEST}:${TAG}"
            echo "${DEST}:${TAG}-$(date -u +%Y%m%d)"
            echo "digest ${DIGEST}"
            echo '```'
            echo
            echo "Update this machine with \`just update\`."
          } >> "$GITHUB_STEP_SUMMARY"
