# Nightly rebuild against upstream Bazzite, pushed to GHCR and signed.
# Only :sway exists, so an untagged ref fails instead of silently following something else.
name: Build and publish

on:
  # Upstream rebuilds daily, so this tracks it without anyone running a build.
  schedule:
    - cron: '0 12 * * *'
  push:
    branches: [main]
    # None of these can change the image, so they should not spend a build.
    paths-ignore:
      - '**.md'
      - 'dotfiles/**'
      - 'verify.sh'
      - '.gitignore'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: bazzite-sway
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: sway

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: sway
    runs-on: ubuntu-24.04

    permissions:
      contents: read      # checkout
      packages: write     # push to ghcr.io
      # No id-token: signing uses a key, not keyless OIDC.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Without this the run pushes an UNSIGNED image that every later upgrade refuses.
      - name: Check the signing secret exists
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "${SIGNING_SECRET}" ]; then
            echo "::error::SIGNING_SECRET is not set. Add the contents of cosign.key as a repository secret named SIGNING_SECRET (Settings -> Secrets and variables -> Actions) before publishing."
            exit 1
          fi
          echo "SIGNING_SECRET is present"

      # The build peaks near 40 GB and the runner starts with about 20 GB free.
      - name: Free up disk space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: 'true'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      # GHCR rejects mixed-case paths and the owner name may have capitals.
      - name: Resolve registry
        id: reg
        run: echo "registry=${IMAGE_REGISTRY,,}" >> "$GITHUB_OUTPUT"

      # --pull=newer, or a nightly rebuild sits on a cached base and never sees upstream.
      - name: Build
        run: |
          just build-image \
            '${{ env.IMAGE_TAG }}' \
            '${{ steps.reg.outputs.registry }}' \
            newer

      # Splits into layers that stay identical across rebuilds, so an update is MB not GB.
      - name: Rechunk
        run: just rechunk-ci '${{ env.IMAGE_TAG }}'

      - name: Disk space after rechunk
        if: always()
        run: df -h /

      # Runs after the rechunk so it also proves the rechunk preserved /etc.
      - name: Check the built image
        env:
          TAG: ${{ env.IMAGE_TAG }}
          REGISTRY: ${{ steps.reg.outputs.registry }}
        run: |
          set -euo pipefail
          sudo podman run --rm -i \
            -e "REG=${REGISTRY}" -e "NS=${REGISTRY##*/}" \
            --entrypoint /usr/bin/bash \
            "localhost/${IMAGE_NAME}:${TAG}" -s <<'EOF'
          set -euo pipefail
          INFO=/usr/share/ublue-os/image-info.json

          # base-image-name stays kinoite, because bazzite's own scripts read it to tell which desktop this is.
          jq -e '."image-name"       == "bazzite-sway"' "$INFO" >/dev/null
          jq -e '."base-image-name"  == "kinoite"'      "$INFO" >/dev/null
          jq -e '."image-ref" | startswith("ostree-image-signed:docker://")' "$INFO" >/dev/null
          grep -q 'PRETTY_NAME="Bazzite Sway"' /usr/lib/os-release

          # The trust files, without which the image cannot verify its own updates.
          test -s "/etc/pki/containers/${NS}.pub"
          grep -q 'use-sigstore-attachments: true' "/etc/containers/registries.d/${NS}.yaml"
          jq -e --arg r "$REG" \
             '.transports.docker[$r][0].type == "sigstoreSigned"' \
             /etc/containers/policy.json >/dev/null
          # The catch-all must survive, or the first switch onto this image is impossible.
          jq -e '.transports.docker[""][0].type == "insecureAcceptAnything"' \
             /etc/containers/policy.json >/dev/null

          # Session essentials, cheap to assert and expensive to discover at boot.
          readlink -f /etc/systemd/system/display-manager.service | grep -q greetd
          test -L /usr/lib/systemd/user/sway-session.target.wants/noctalia.service
          test -e /usr/share/wayland-sessions/sway.desktop

          # ghostty comes from Terra, so an outage or rename fails here, not at first login.
          test -x /usr/bin/ghostty
          test -f /usr/share/terminfo/x/xterm-ghostty
          grep -q '^set \$term ghostty$' /etc/sway/config
          command -v foot >/dev/null    # retained fallback

          # Fetched from a GitHub release, so a retag or a stale checksum must fail here.
          test -f /usr/share/fonts/hack-nerd-fonts/HackNerdFontMono-Regular.ttf
          # fc-list -q, not a grep pipe, which SIGPIPEs a match into a failure.
          fc-list -q 'Hack Nerd Font Mono'

          # swayfx needs the old libwlroots-0.19, so the day F44 drops it this must fail here.
          # --whatprovides, because swayfx provides sway and no package is named sway.
          rpm -q swayfx
          rpm -q --whatprovides sway >/dev/null
          test -x /usr/bin/sway
          # Into a variable, not a grep pipe, which SIGPIPEs a match into a failure.
          sway_libs="$(ldd /usr/bin/sway)"
          [[ "$sway_libs" == *libwlroots-0.19.so* ]]
          [[ "$sway_libs" == *libscenefx* ]]
          # sway-config-fedora owns /etc/sway/config and start-sway, so it must survive.
          rpm -q sway-config-fedora sway-systemd >/dev/null
          # On Vulkan SwayFX starts fine and silently draws no effects.
          grep -q '^WLR_RENDERER=gles2$' /etc/sway/environment
          # No sway -C here: it cannot run in a container, so verify.sh checks the config at runtime.

          # One package is the whole desktop bar the compositor, so assert it hard.
          # Vendor too, or a Terra build winning this name would swap the version line silently.
          rpm -q noctalia >/dev/null
          [[ "$(rpm -q --queryformat '%{VENDOR}' noctalia)" == "Fedora Project" ]]
          test -x /usr/bin/noctalia
          test -d /usr/share/noctalia/assets/templates
          test -f /usr/lib/systemd/user/noctalia.service
          noctalia_libs="$(ldd /usr/bin/noctalia)"
          [[ "$noctalia_libs" == *libEGL*            ]]
          [[ "$noctalia_libs" == *libGLESv2*         ]]
          # These three fail silently: no password prompt, no wifi login, no tray.
          [[ "$noctalia_libs" == *libpolkit-agent-1* ]]
          grep -aq 'org.freedesktop.NetworkManager.SecretAgent' /usr/bin/noctalia
          grep -aq 'org.kde.StatusNotifierHost'                 /usr/bin/noctalia

          # rofi needs an explicit exclude, because the rofi package provides rofi-wayland.
          for p in rofi SwayNotificationCenter mako wlogout cliphist swappy \
                   mate-polkit hyprlock hypridle; do
            ! rpm -q "$p" >/dev/null
          done

          # These cannot be removed, so empty /etc files retire them instead.
          rpm -q waybar swaylock swayidle grimshot lxqt-policykit >/dev/null
          for f in 90-bar.conf 90-swayidle.conf 95-autostart-policykit-agent.conf \
                   60-bindings-screenshot.conf 60-bindings-volume.conf \
                   60-bindings-brightness.conf 60-bindings-media.conf; do
            test -f "/usr/share/sway/config.d/$f"
            test -f "/etc/sway/config.d/$f"
            ! grep -qvE '^[[:space:]]*(#|$)' "/etc/sway/config.d/$f"
          done

          # The greeter brings its own compositor, so only the wrapper and greeter.toml are ours.
          rpm -q noctalia-greeter greetd-fakegreet >/dev/null
          test -x /usr/bin/noctalia-greeter-session
          test -x /usr/bin/noctalia-greeter-compositor
          test -d /usr/share/noctalia-greeter/assets
          test -x /usr/libexec/noctalia-greeter-nvidia
          grep -q 'WLR_RENDERER:=gles2' /usr/libexec/noctalia-greeter-nvidia
          grep -q '^command = "/usr/libexec/noctalia-greeter-nvidia"$' /etc/greetd/config.toml
          # tmpfiles.d copies this at boot, and the colour proves it is our greyscale copy.
          test -s /usr/share/factory/var/lib/noctalia-greeter/greeter.toml
          grep -q '^surface *= *"#1a1a1a"$' /usr/share/factory/var/lib/noctalia-greeter/greeter.toml
          # C, never C+, which only descends into a directory and would skip this file.
          grep -qE '^r[[:space:]]+/var/lib/noctalia-greeter/greeter\.toml[[:space:]]*$' /usr/lib/tmpfiles.d/bazzite-sway.conf
          grep -qE '^C[[:space:]]+/var/lib/noctalia-greeter/greeter\.toml[[:space:]]'  /usr/lib/tmpfiles.d/bazzite-sway.conf
          ! grep -qE '^C\+[[:space:]]+/var/lib/noctalia-greeter/greeter\.toml'        /usr/lib/tmpfiles.d/bazzite-sway.conf
          # Without this alias the greeter cannot write its state and the screen stays blank.
          grep -q '^/var/lib/noctalia-greeter /var/lib/greetd$' \
            /etc/selinux/targeted/contexts/files/file_contexts.subs
          # wlroots 0.20 for the greeter, 0.19 for swayfx, both from Fedora.
          greeter_libs="$(ldd /usr/bin/noctalia-greeter-compositor)"
          [[ "$greeter_libs" == *libwlroots-0.20.so* ]]
          [[ "$(rpm -q --queryformat '%{VENDOR}' wlroots)" == "Fedora Project" ]]
          # Desktop entries are the only source of the session list now.
          grep -q '^Exec=start-sway$' /usr/share/wayland-sessions/sway.desktop
          # On the finished image Sway must be the only session, or KDE removal missed something.
          greeter_sessions="$(noctalia-greeter sessions)"
          [[ "$greeter_sessions" == *Sway* ]]
          [[ "$greeter_sessions" != *Plasma* ]]
          test ! -e /etc/greetd/environments
          command -v tuigreet >/dev/null
          ! command -v gtkgreet >/dev/null

          # Also fetched from a GitHub release, and user-* proves the full icon set landed.
          test -d /usr/share/themes/adw-gtk3-dark
          test -d /usr/share/icons/Papirus-Dark
          fc-list -q 'Inter'
          [[ "$(readlink /usr/share/icons/Papirus/48x48/places/folder.svg)"    == *folder-black* ]]
          [[ "$(readlink /usr/share/icons/Papirus/48x48/places/user-home.svg)" == *user-black*   ]]

          # Disabled, or a booted machine could later pull from a third-party repo.
          for f in /etc/yum.repos.d/_copr_swayfx-swayfx.repo; do
            test -f "$f"
            grep -q '^enabled=0$' "$f"
          done
          # The hypr COPR left with 16-hyprlock.sh, so its repo file must be gone too.
          test ! -f /etc/yum.repos.d/_copr_scottames-hypr.repo

          echo "image checks passed"
          EOF

      # Two logins, because podman runs as root and cosign as the runner user.
      - name: Log in to GHCR (root, for podman push)
        if: github.event_name != 'pull_request'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | sudo podman login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Log in to GHCR (runner, for cosign)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        id: push
        env:
          TAG: ${{ env.IMAGE_TAG }}
          REGISTRY: ${{ steps.reg.outputs.registry }}
        run: |
          set -euxo pipefail
          dest="${REGISTRY}/${IMAGE_NAME}"
          # One date for the loop, so a run over midnight cannot make two dated tags.
          dated="${TAG}-$(date -u +%Y%m%d)"
          # Same manifest both times, so one signature covers both tags.
          for t in "${TAG}" "${dated}"; do
            sudo podman push --digestfile=/tmp/digestfile \
              "localhost/${IMAGE_NAME}:${TAG}" "${dest}:${t}"
          done
          {
            echo "dest=${dest}"
            echo "digest=$(sudo cat /tmp/digestfile)"
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # Without these flags cosign v3 writes a bundle podman and bootc cannot read.
      - name: Sign the image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          DEST: ${{ steps.push.outputs.dest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign -y \
            --new-bundle-format=false \
            --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY \
            "${DEST}@${DIGEST}"

      # If the secret and the committed cosign.pub drift apart, fail here, not on the next update.
      - name: Verify the signature
        if: github.event_name != 'pull_request'
        env:
          DEST: ${{ steps.push.outputs.dest }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --key cosign.pub \
            --insecure-ignore-tlog=true \
            "${DEST}@${DIGEST}"
          echo "signature verifies against the committed cosign.pub"

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DEST: ${{ steps.push.outputs.dest }}
          DIGEST: ${{ steps.push.outputs.digest }}
          TAG: ${{ env.IMAGE_TAG }}
        run: |
          {
            echo "### \`${TAG}\` published"
            echo
            echo '```'
            echo "${DEST}:${TAG}"
            echo "${DEST}:${TAG}-$(date -u +%Y%m%d)"
            echo "digest ${DIGEST}"
            echo '```'
            echo
            echo "Update this machine with \`just update\`."
          } >> "$GITHUB_STEP_SUMMARY"
